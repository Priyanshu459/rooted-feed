<!-- CHAT VIEW -->
    <div class="main-feed" id="chatView" style="display:none;">
      <div class="feed-header" style="display:flex; align-items:center; gap:16px;">
        <span onclick="openMessages()" style="cursor:pointer; font-size:24px;">&larr;</span>
        <img id="chatAvatar" style="width:36px;height:36px;border-radius:50%;object-fit:cover;display:none;">
        <div id="chatAvatarText" class="mini-avatar" style="display:none;width:36px;height:36px;font-size:14px;"></div>
        <div style="flex:1;min-width:0;">
          <h2 id="chatName" style="font-size:18px;font-weight:700;margin:0;">Chat</h2>
          <div id="typingIndicator" style="font-size:12px;color:var(--text-dim);min-height:16px;line-height:1.2;"></div>
        </div>
      </div>
      <div id="chatMessages"
        style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;"></div>
      <div style="padding:16px; border-top:1px solid var(--border); display:flex; gap:12px;">
        <input type="text" id="chatInput" placeholder="Message..."
          style="flex:1; background:var(--surface); border:none; padding:12px 16px; border-radius:24px; color:#fff; outline:none;"
          oninput="handleTypingInput()"
          onkeydown="if(event.key==='Enter') sendDM()">
        <button onclick="sendDM()"
          style="background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer;">Send</button>
      </div>
    </div>
