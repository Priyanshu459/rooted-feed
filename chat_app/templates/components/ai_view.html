<!-- AI VIEW -->
    <div class="main-feed" id="aiView" style="display:none;">
      <div class="feed-header">
        <h2 style="font-size:18px; font-weight:700;">Rooted AI</h2>
      </div>
      <div id="aiMessages"
        style="flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;"></div>
      <div style="padding:16px; border-top:1px solid var(--border); display:flex; gap:12px;">
        <input type="text" id="aiInput" placeholder="Ask anything..."
          style="flex:1; background:var(--surface); border:none; padding:12px 16px; border-radius:24px; color:#fff; outline:none;"
          onkeydown="if(event.key==='Enter') sendAIMessage()">
        <button onclick="sendAIMessage()"
          style="background:none; border:none; color:var(--accent); font-weight:700; cursor:pointer;">Ask</button>
      </div>
    </div>
