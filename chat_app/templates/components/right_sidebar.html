<!-- RIGHT SIDEBAR -->
    <div class="right-sidebar">
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <path d="M21 21L16.65 16.65" />
        </svg>
        <input type="text" placeholder="Search Rooted"
          onkeydown="if(event.key==='Enter'){ switchTab('explore'); document.getElementById('exploreSearch').value=this.value; filterExplorePosts(); }">
      </div>

      <div class="trending-box" id="trendingBox">
        <h3 class="trending-title">Trending for you</h3>
        <div id="trendingList">
          <div style="color:var(--text-dim); font-size:13px; padding:8px 0;">Loading trends...</div>
        </div>
      </div>

      <div class="trending-box" style="margin-top: 16px;" id="whoToFollowBox">
        <h3 class="trending-title">Who to follow</h3>
        <div id="whoToFollowList">
          <div style="color:var(--text-dim); font-size:13px; padding:8px 0;">Loading suggestions...</div>
        </div>
      </div>

      <div style="padding:16px; font-size:12px; color:var(--text-light);">
        &copy; 2026 Rooted Social
      </div>
    </div>
