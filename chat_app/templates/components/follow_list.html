<!-- FOLLOW LIST VIEW (main feed tab) -->
<div class="main-feed" id="followListView" style="display:none; flex-direction:column;">
  <div class="feed-header" style="display:flex; align-items:center; gap:16px;">
    <span onclick="switchTab('profileView')" style="cursor:pointer; font-size:24px;">&larr;</span>
    <h2 id="followListViewTitle" style="font-size:20px; font-weight:700;">Followers</h2>
  </div>
  <div style="display:flex; border-bottom:1px solid rgba(255,255,255,0.1); background:var(--bg-card); flex-shrink:0;">
    <button id="viewTabFollowersBtn" onclick="switchFollowViewTab('followers')"
      style="flex:1; padding:16px; font-weight:700; font-size:15px; color:#fff; border:none; border-bottom:3px solid var(--accent); background:rgba(255,255,255,0.03); cursor:pointer;">Followers</button>
    <button id="viewTabFollowingBtn" onclick="switchFollowViewTab('following')"
      style="flex:1; padding:16px; font-weight:700; font-size:15px; color:var(--text-dim); border:none; border-bottom:3px solid transparent; background:transparent; cursor:pointer;">Following</button>
  </div>
  <div id="followViewListContainer"
    style="flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;">
    <!-- Loaded dynamically -->
  </div>
</div>
