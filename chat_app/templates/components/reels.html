<!-- REELS VIEW -->
<div class="main-feed" id="reelsView" style="display:none; padding:0; background:#000; position:relative; flex-direction:column; height:100%; overflow:hidden;">
  <div style="position:absolute; top:20px; right:20px; z-index:100;">
    <button onclick="openCreateReelModal()" style="background:rgba(0,0,0,0.55); color:#fff; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.25); border-radius:24px; padding:8px 16px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; font-weight:600; font-size:14px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 7l-7 5 7 5V7z"></path>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        <line x1="8" y1="9" x2="8" y2="15"></line>
        <line x1="5" y1="12" x2="11" y2="12"></line>
      </svg>
      Add Reel
    </button>
  </div>
  <div id="reelsFeed" style="width:100%; height:100%; overflow-y:auto; scroll-snap-type:y mandatory; -ms-overflow-style:none; scrollbar-width:none;">
    <div id="reelsEmptyState" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#fff; text-align:center; padding:40px 20px;">
      <div style="font-size:56px; margin-bottom:20px;">🎬</div>
      <div style="font-size:20px; font-weight:700; margin-bottom:10px; color:#fff;">No Reels Yet</div>
      <div style="font-size:15px; color:rgba(255,255,255,0.5); margin-bottom:28px;">Be the first to share a reel!</div>
      <button onclick="openCreateReelModal()" style="background:linear-gradient(135deg,#f09433,#dc2743,#bc1888); color:#fff; border:none; border-radius:24px; padding:14px 32px; font-size:15px; font-weight:700; cursor:pointer;">+ Upload Reel</button>
    </div>
  </div>
  
  <!-- Reels Comments Drawer -->
  <div id="reelCommentsDrawer" style="display:none; position:absolute; bottom:0; left:0; width:100%; height:60%; background:#1a1a1a; border-top-left-radius:24px; border-top-right-radius:24px; z-index:200; flex-direction:column; box-shadow:0 -10px 40px rgba(0,0,0,0.5); transform:translateY(100%); transition:transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
      <div style="padding:16px 20px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center;">
          <h3 style="color:#fff; font-size:18px; font-weight:700; margin:0;">Comments (<span id="reelDrawerCommentsCount">0</span>)</h3>
          <button onclick="closeReelComments()" style="background:rgba(255,255,255,0.1); border:none; color:#fff; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">&#x2715;</button>
      </div>
      <div id="reelCommentsList" style="flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:16px;">
          <!-- Comments injected here -->
      </div>
      <div style="padding:16px 20px; border-top:1px solid rgba(255,255,255,0.08); display:flex; gap:10px; align-items:center;">
          <input type="text" id="reelCommentInput" placeholder="Add a comment..." style="flex:1; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:10px 16px; color:#fff; font-size:14px; outline:none;" onkeypress="if(event.key==='Enter') postReelComment()">
          <button onclick="postReelComment()" style="background:linear-gradient(135deg,#f09433,#dc2743); color:#fff; border:none; border-radius:20px; padding:10px 18px; font-weight:600; font-size:14px; cursor:pointer;">Post</button>
      </div>
  </div>
</div>

<!-- Upload Reel Modal -->
<div id="createReelModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9000; justify-content:center; align-items:center;" onclick="if(event.target===this) closeCreateReelModal()">
  <div style="background:#1c1c1c; border:1px solid rgba(255,255,255,.15); border-radius:24px; width:92%; max-width:480px; max-height:90vh; overflow-y:auto; display:flex; flex-direction:column;">
    <div style="padding:18px 20px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
      <h3 style="font-size:17px; font-weight:700; color:#fff; margin:0;">Upload Reel</h3>
      <button onclick="closeCreateReelModal()" style="background:rgba(255,255,255,0.08); border:none; color:#aaa; font-size:18px; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer;">&#x2715;</button>
    </div>
    <div style="padding:20px; flex:1;">
      <div id="reelUploadArea" onclick="document.getElementById('reelFileInput').click()" style="border:2px dashed rgba(255,255,255,0.18); border-radius:16px; padding:44px 20px; text-align:center; cursor:pointer; background:rgba(255,255,255,0.03); transition:border-color 0.2s;">
        <div style="font-size:36px; margin-bottom:12px;">🎬</div>
        <div style="font-weight:600; font-size:15px; color:#fff; margin-bottom:6px;">Tap to choose a video</div>
        <div style="font-size:13px; color:rgba(255,255,255,0.4);">MP4 &middot; WebM &middot; MOV &mdash; max 50 MB</div>
      </div>
      <input type="file" id="reelFileInput" accept="video/*" style="display:none;" onchange="handleReelFileSelect(event)">
      <div id="reelPreviewContainer" style="display:none; position:relative; border-radius:16px; overflow:hidden; background:#000; margin-top:16px; height:320px;">
        <video id="reelPreviewVideo" style="width:100%; height:100%; object-fit:cover;" loop muted playsinline></video>
        <button onclick="clearReelSelection()" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.65); color:#fff; border:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:14px;">&#x2715;</button>
      </div>
      <div style="margin-top:16px;">
        <textarea id="reelCaptionInput" placeholder="Write a caption..." rows="2"
          style="width:100%; box-sizing:border-box; background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px 14px; color:#ffffff !important; font-size:14px; outline:none; resize:none; font-family:inherit; line-height:1.5;"></textarea>
      </div>
      <div id="reelUploadProgress" style="display:none; margin-top:18px;">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px; font-size:13px; font-weight:600; color:#fff;">
          <span>Uploading&#x2026;</span>
          <span id="reelUploadPct">0%</span>
        </div>
        <div style="width:100%; height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden;">
          <div id="reelUploadBar" style="height:100%; width:0%; background:linear-gradient(90deg,#f09433,#dc2743); border-radius:3px; transition:width 0.2s ease-out;"></div>
        </div>
      </div>
    </div>
    <div style="padding:16px 20px; border-top:1px solid rgba(255,255,255,0.08); display:flex; justify-content:flex-end; flex-shrink:0;">
      <button id="submitReelBtn" onclick="uploadReel()" disabled
        style="background:linear-gradient(135deg,#f09433,#dc2743,#bc1888); color:#fff; border:none; border-radius:24px; padding:11px 28px; font-size:14px; font-weight:700; cursor:not-allowed; opacity:0.45; transition:opacity 0.2s;">Share Reel</button>
    </div>
  </div>
</div>

<script>
var reelsLoaded = false;
var reelsPage = 1;
var hasNextReels = true;
var isLoadingReels = false;
var reelVideos = [];
var reelObserver = null;
window.globalReelsMuted = localStorage.getItem('rooted_reels_muted') === 'true' || localStorage.getItem('rooted_reels_muted') === null;
var currentReelIdForComments = null;
var currentReelCommentBtn = null;

function initReels() {
    if (reelsLoaded) return;
    reelsLoaded = true;

    reelObserver = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
            var vid = entry.target;
            if (entry.isIntersecting && entry.intersectionRatio >= 0.6) {
                vid.play().catch(function(){});
            } else {
                vid.pause();
                vid.currentTime = 0;
            }
        });
    }, { threshold: 0.6 });

    fetchReels();

    var feed = document.getElementById('reelsFeed');
    feed.addEventListener('scroll', function() {
        if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 400) {
            fetchReels();
        }
    }, { passive: true });
}

function fetchReels() {
    if (isLoadingReels || !hasNextReels) return;
    isLoadingReels = true;

    fetch('/api/reels?page=' + reelsPage)
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var container = document.getElementById('reelsFeed');
        var emptyState = document.getElementById('reelsEmptyState');

        if (data.reels && data.reels.length > 0) {
            if (emptyState) emptyState.style.display = 'none';

            data.reels.forEach(function(r) {
                var el = document.createElement('div');
                el.style.cssText = 'width:100%;height:100%;min-height:100%;position:relative;scroll-snap-align:start;scroll-snap-stop:always;background:#000;flex-shrink:0;overflow:hidden;';

                var likedFill = r.is_liked ? '#ff3040' : 'none';
                var likedStroke = r.is_liked ? '#ff3040' : '#fff';
                var handle = r.user.handle || r.user.name || '';
                var initials = (r.user.name || handle || 'U').charAt(0).toUpperCase();
                var avatarHtml = r.user.photo
                    ? '<img src="' + r.user.photo + '" style="width:36px;height:36px;border-radius:50%;border:2px solid #fff;object-fit:cover;">'
                    : '<div style="width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:linear-gradient(135deg,#f09433,#bc1888);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:15px;">' + initials + '</div>';

                el.innerHTML =
                    '<video style="width:100%;height:100%;object-fit:cover;display:block;position:absolute;top:0;left:0;" loop ' + (window.globalReelsMuted ? 'muted' : '') + ' playsinline></video>' +
                    '<button onclick="toggleMute(this)" style="position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.55);color:#fff;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.25);width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;">' +
                        '<svg class="mute-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:' + (window.globalReelsMuted ? 'block' : 'none') + '"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>' +
                        '<svg class="unmute-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:' + (window.globalReelsMuted ? 'none' : 'block') + '"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>' +
                    '</button>' +
                    '<div style="position:absolute;bottom:0;left:0;right:0;padding:20px 16px 32px;background:linear-gradient(transparent,rgba(0,0,0,0.8));display:flex;justify-content:space-between;align-items:flex-end;">' +
                        '<div style="flex:1;margin-right:12px;">' +
                            '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
                                avatarHtml +
                                '<span style="font-weight:700;font-size:14px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.9);">@' + handle + '</span>' +
                            '</div>' +
                            (r.caption ? '<p style="font-size:14px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.9);margin:0;line-height:1.5;">' + r.caption + '</p>' : '') +
                        '</div>' +
                        '<div style="display:flex;flex-direction:column;align-items:center;gap:20px;margin-bottom:16px;">' +
                            '<button data-reel-id="' + r.id + '" onclick="toggleLikeReel(\'' + r.id + '\',this)" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;padding:0;">' +
                                '<svg width="28" height="28" viewBox="0 0 24 24" fill="' + likedFill + '" stroke="' + likedStroke + '" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>' +
                                '<span class="reel-likes-count" style="font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.8);">' + r.likes_count + '</span>' +
                            '</button>' +
                            '<button onclick="openReelComments(\'' + r.id + '\', this)" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;padding:0;">' +
                                '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>' +
                                '<span style="font-size:12px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.8);">' + (r.comments_count || 0) + '</span>' +
                            '</button>' +
                        '</div>' +
                    '</div>';

                var videoEl = el.querySelector('video');
                videoEl.src = r.video_url;
                container.appendChild(el);
                reelVideos.push(videoEl);
                if (reelObserver) reelObserver.observe(videoEl);
            });
        }

        hasNextReels = data.has_next;
        reelsPage++;
        isLoadingReels = false;
    })
    .catch(function(err) {
        console.error('Reels fetch error:', err);
        isLoadingReels = false;
    });
}

function toggleLikeReel(reelId, btn) {
    if (navigator.vibrate) navigator.vibrate(50);
    var csrfToken = document.querySelector('meta[name="csrf-token"]');
    var headers = { 'Content-Type': 'application/json' };
    if (csrfToken && csrfToken.content) {
        headers['X-CSRFToken'] = csrfToken.content;
    }
    fetch('/api/reels/' + reelId + '/like', { method: 'POST', headers: headers })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var svg = btn.querySelector('svg');
        var count = btn.querySelector('.reel-likes-count');
        if (data.is_liked) {
            svg.setAttribute('fill', '#ff3040');
            svg.setAttribute('stroke', '#ff3040');
        } else {
            svg.setAttribute('fill', 'none');
            svg.setAttribute('stroke', '#fff');
        }
        if (count) count.textContent = data.likes_count;
    });
}

function openCreateReelModal() {
    document.getElementById('createReelModal').style.display = 'flex';
}
function closeCreateReelModal() {
    document.getElementById('createReelModal').style.display = 'none';
    clearReelSelection();
}

function toggleMute(btn) {
    window.globalReelsMuted = !window.globalReelsMuted;
    localStorage.setItem('rooted_reels_muted', window.globalReelsMuted);
    document.querySelectorAll('#reelsFeed video').forEach(function(vid) {
        vid.muted = window.globalReelsMuted;
        var btnInVid = vid.parentElement.querySelector('button[onclick="toggleMute(this)"]');
        if (btnInVid) {
            btnInVid.querySelector('.mute-icon').style.display = window.globalReelsMuted ? 'block' : 'none';
            btnInVid.querySelector('.unmute-icon').style.display = window.globalReelsMuted ? 'none' : 'block';
        }
    });
}

function openReelComments(reelId, btn) {
    currentReelIdForComments = reelId;
    currentReelCommentBtn = btn;
    var drawer = document.getElementById('reelCommentsDrawer');
    drawer.style.display = 'flex';
    setTimeout(function() {
        drawer.style.transform = 'translateY(0)';
    }, 10);
    loadReelComments();
}

function closeReelComments() {
    var drawer = document.getElementById('reelCommentsDrawer');
    drawer.style.transform = 'translateY(100%)';
    setTimeout(function() {
        drawer.style.display = 'none';
    }, 300);
}

function loadReelComments() {
    var list = document.getElementById('reelCommentsList');
    var count = document.getElementById('reelDrawerCommentsCount');
    list.innerHTML = '<div style="text-align:center; padding:24px; color:rgba(255,255,255,0.5);">Loading comments...</div>';
    
    fetch('/api/reels/' + currentReelIdForComments + '/comments')
    .then(function(r) { return r.json(); })
    .then(function(comments) {
        if (count) count.textContent = comments.length;
        if (currentReelCommentBtn) {
            var btnCount = currentReelCommentBtn.querySelector('span');
            if (btnCount) btnCount.textContent = comments.length;
        }
        
        if (comments.length === 0) {
            list.innerHTML = '<div style="text-align:center; padding:32px; color:rgba(255,255,255,0.5);">No comments yet. Start the conversation!</div>';
            return;
        }
        
        list.innerHTML = comments.map(function(c) {
            var avatar = c.user_photo 
                ? '<img src="' + c.user_photo + '" style="width:32px; height:32px; border-radius:50%; object-fit:cover;">'
                : '<div style="width:32px; height:32px; border-radius:50%; background:linear-gradient(135deg,#f09433,#dc2743); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:14px;">' + c.user_name.charAt(0) + '</div>';
            return '<div style="display:flex; gap:12px; margin-bottom:12px;">' +
                     avatar +
                     '<div style="flex:1;">' +
                       '<div style="font-size:13px; font-weight:600; color:#fff; margin-bottom:2px;">' + c.user_name + ' <span style="font-weight:400; color:rgba(255,255,255,0.5); font-size:12px;">@' + c.user_handle + '</span></div>' +
                       '<div style="font-size:14px; color:#ddd; line-height:1.4;">' + c.text + '</div>' +
                     '</div>' +
                   '</div>';
        }).join('');
    });
}

function postReelComment() {
    var input = document.getElementById('reelCommentInput');
    var text = input.value.trim();
    if (!text || !currentReelIdForComments) return;
    
    var csrfToken = document.querySelector('meta[name="csrf-token"]');
    var headers = { 'Content-Type': 'application/json' };
    if (csrfToken && csrfToken.content) {
        headers['X-CSRFToken'] = csrfToken.content;
    }
    
    input.disabled = true;
    fetch('/api/reels/' + currentReelIdForComments + '/comments', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({ text: text })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        input.disabled = false;
        if (data.success) {
            input.value = '';
            loadReelComments();
        } else {
            alert('Failed to post comment');
        }
    })
    .catch(function() {
        input.disabled = false;
        alert('Network error');
    });
}

var selectedReelFile = null;
function handleReelFileSelect(event) {
    var file = event.target.files[0];
    if (!file) return;
    if (file.size > 50 * 1024 * 1024) {
        alert('Video must be under 50 MB. Please compress and try again.');
        event.target.value = '';
        return;
    }
    selectedReelFile = file;
    var url = URL.createObjectURL(file);
    var vid = document.getElementById('reelPreviewVideo');
    vid.src = url;
    vid.load();
    vid.play().catch(function(){});

    document.getElementById('reelPreviewContainer').style.display = 'block';
    document.getElementById('reelUploadArea').style.display = 'none';

    var btn = document.getElementById('submitReelBtn');
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.cursor = 'pointer';
}

function clearReelSelection() {
    selectedReelFile = null;
    var fi = document.getElementById('reelFileInput');
    if (fi) fi.value = '';
    var vid = document.getElementById('reelPreviewVideo');
    if (vid) { vid.pause(); vid.src = ''; }
    document.getElementById('reelPreviewContainer').style.display = 'none';
    document.getElementById('reelUploadArea').style.display = 'block';
    document.getElementById('reelCaptionInput').value = '';
    document.getElementById('reelUploadProgress').style.display = 'none';
    var btn = document.getElementById('submitReelBtn');
    btn.disabled = true;
    btn.style.opacity = '0.45';
    btn.style.cursor = 'not-allowed';
    btn.textContent = 'Share Reel';
}

function uploadReel() {
    if (!selectedReelFile) return;
    var btn = document.getElementById('submitReelBtn');
    btn.disabled = true;
    btn.textContent = 'Uploading\u2026';
    document.getElementById('reelUploadProgress').style.display = 'block';

    var formData = new FormData();
    formData.append('media', selectedReelFile);
    formData.append('type', 'reel');

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/upload', true);
    
    var csrfToken = document.querySelector('meta[name="csrf-token"]');
    if (csrfToken && csrfToken.content) {
        xhr.setRequestHeader('X-CSRFToken', csrfToken.content);
    }

    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            var pct = Math.round((e.loaded / e.total) * 100);
            document.getElementById('reelUploadBar').style.width = pct + '%';
            document.getElementById('reelUploadPct').textContent = pct + '%';
        }
    };

    xhr.onload = function() {
        if (xhr.status === 200) {
            var res;
            try { res = JSON.parse(xhr.responseText); } catch(e) {
                alert('Server error. Please try again.');
                btn.disabled = false; btn.textContent = 'Share Reel'; return;
            }
            if (res.error) {
                alert('Upload error: ' + res.error);
                btn.disabled = false; btn.textContent = 'Share Reel'; return;
            }
            var caption = document.getElementById('reelCaptionInput').value.trim();
            fetch('/api/reels/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ video_url: res.url, caption: caption })
            })
            .then(function(r) { return r.json(); })
            .then(function() {
                closeCreateReelModal();
                reelsLoaded = false;
                reelsPage = 1;
                hasNextReels = true;
                reelVideos = [];
                if (reelObserver) { reelObserver.disconnect(); reelObserver = null; }
                var feed = document.getElementById('reelsFeed');
                feed.innerHTML = '<div id="reelsEmptyState" style="display:none;"></div>';
                initReels();
            })
            .catch(function() {
                alert('Failed to save reel. Please try again.');
                btn.disabled = false; btn.textContent = 'Share Reel';
            });
        } else {
            alert('Upload failed (HTTP ' + xhr.status + '). Try again.');
            btn.disabled = false; btn.textContent = 'Share Reel';
        }
    };
    xhr.onerror = function() {
        alert('Network error. Check your connection and retry.');
        btn.disabled = false; btn.textContent = 'Share Reel';
    };
    xhr.send(formData);
}
</script>
