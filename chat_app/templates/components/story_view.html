<!-- STORY VIEW (full-screen tab, replaces fixed overlay) -->
    <div class="main-feed" id="storyView" style="display:none; background:#000; border:none; overflow:hidden; position:relative; flex-direction:column; align-items:center; justify-content:center;">

      <!-- Progress segments -->
      <div class="story-progress-bar" id="storyProgressBar"></div>

      <!-- Author header -->
      <div class="story-header">
        <div id="storyViewerAvatarWrap"></div>
        <div style="display:flex;flex-direction:column;">
          <span id="storyViewerName" style="font-weight:700;font-size:15px;text-shadow:0 1px 3px rgba(0,0,0,.6);"></span>
          <span id="storyViewerTime" style="font-size:12px;opacity:.75;text-shadow:0 1px 3px rgba(0,0,0,.6);"></span>
        </div>
      </div>

      <!-- Close → back to Home -->
      <span onclick="closeStory()" style="position:absolute;top:20px;right:20px;color:#fff;font-size:36px;cursor:pointer;z-index:10001;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.5);">&#x2715;</span>

      <!-- Tap zones + media -->
      <div class="story-content" style="position:relative;width:100%;height:100%;max-width:450px;display:flex;align-items:center;justify-content:center;">
        <div onclick="prevStory()" style="position:absolute;left:0;top:0;width:50%;height:calc(100% - 90px);z-index:10;cursor:pointer;"></div>
        <div onclick="nextStory()" style="position:absolute;right:0;top:0;width:50%;height:calc(100% - 90px);z-index:10;cursor:pointer;"></div>
        <div id="storyMediaContainer" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;"></div>
        <div id="storyText" style="position:absolute;bottom:90px;left:20px;right:20px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);font-size:20px;text-align:center;font-weight:600;pointer-events:none;"></div>

        <!-- Interactive Footer -->
        <div id="storyFooterActions" style="position:absolute;bottom:20px;left:20px;right:20px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto;">
          <div style="display:flex;align-items:center;gap:16px;">
            <button onclick="likeCurrentStory(event)" id="storyLikeBtn" style="background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:8px 16px;border-radius:20px;display:flex;align-items:center;gap:6px;font-size:15px;backdrop-filter:blur(8px);cursor:pointer;transition:all 0.2s;"><span id="storyLikeIcon">🤍</span> <span id="storyLikesCount">0</span></button>
            <button onclick="toggleStoryComments(event)" id="storyCommentBtn" style="background:rgba(0,0,0,0.5);color:#fff;border:1px solid rgba(255,255,255,0.2);padding:8px 16px;border-radius:20px;display:flex;align-items:center;gap:6px;font-size:15px;backdrop-filter:blur(8px);cursor:pointer;transition:all 0.2s;">💬 <span id="storyCommentsCount">0</span></button>
          </div>
          <div id="storyOwnerActions" style="display:none;align-items:center;gap:12px;">
            <button onclick="openCreateStory(event)" style="background:var(--accent);color:#0A0D0B;border:none;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 2px 10px rgba(61,255,140,0.3);">+ Add Story</button>
            <button onclick="deleteCurrentStory(event)" style="background:rgba(220,38,67,0.8);color:#fff;border:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;" title="Delete Story">🗑️</button>
          </div>
        </div>
      </div>

      <!-- Sliding Story Comments Drawer -->
      <div id="storyCommentsDrawer" style="position:absolute;bottom:0;left:0;right:0;height:75%;max-width:450px;margin:0 auto;background:#1a1d1b;border-top-left-radius:24px;border-top-right-radius:24px;z-index:30000;display:none;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,0.8);border:1px solid rgba(255,255,255,0.1);">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08);">
          <h3 style="color:#fff;font-size:18px;font-weight:700;margin:0;">Comments (<span id="drawerCommentsCount">0</span>)</h3>
          <button onclick="toggleStoryComments(event)" style="color:var(--text-dim);background:rgba(255,255,255,0.08);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;">✕</button>
        </div>
        <div id="storyCommentsList" style="flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;">
          <!-- Comments injected here -->
        </div>
        <div style="padding:16px 24px;border-top:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.2);display:flex;gap:12px;align-items:center;">
          <input type="text" id="storyCommentInput" placeholder="Add a comment..." style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:12px 18px;color:#fff;outline:none;font-size:14px;" onkeydown="if(event.key==='Enter') postStoryComment()">
          <button onclick="postStoryComment()" style="background:var(--accent);color:#0A0D0B;border:none;padding:12px 24px;border-radius:20px;font-weight:700;cursor:pointer;">Send</button>
        </div>
      </div>
    </div>
