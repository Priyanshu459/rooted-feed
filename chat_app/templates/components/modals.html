        <div id="storyUploadProgress" style="display:none; margin-bottom:14px;">
          <div style="font-size:13px; color:#a8a8a8; margin-bottom:6px;" id="storyUploadLabel">Uploading…</div>
          <div style="background:rgba(255,255,255,.12); border-radius:4px; height:4px; overflow:hidden;">
            <div id="storyUploadBar" style="height:100%; width:0%; background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
                 border-radius:4px; transition:width .2s;"></div>
          </div>

        <!-- Buttons row -->
        <div style="display:flex; gap:10px; align-items:center;">
          <!-- Photo/video picker (entire label is clickable) -->
          <label for="storyMediaInput" style="flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
                    padding:11px 14px; border-radius:12px; border:1.5px solid rgba(255,255,255,.15);
                    color:#a8a8a8; font-size:14px; font-weight:500; cursor:pointer;
                    transition:all .15s;"
            onmouseover="this.style.borderColor='rgba(255,255,255,.35)'; this.style.color='#fff'"
            onmouseout="this.style.borderColor='rgba(255,255,255,.15)'; this.style.color='#a8a8a8'">
            📷 Add Media
          </label>
          <input type="file" id="storyMediaInput" accept="image/*,video/*" style="display:none;"
            onchange="handleStoryMediaSelect(event)">

          <button id="postStoryBtn" onclick="postStory()" style="flex:1; padding:11px 14px; border-radius:12px; border:none; cursor:pointer;
               background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888);
               color:#fff; font-size:14px; font-weight:700; font-family:inherit;
               transition:opacity .15s, transform .15s;"
            onmouseover="this.style.opacity='.88'; this.style.transform='translateY(-1px)'"

            Post Story

      </div>

    <!-- STORIES SCRIPT -->
    <script>
      // Move createStoryModal to <body> so it's never trapped in a hidden parent
      document.addEventListener('DOMContentLoaded', function () {
        var m = document.getElementById('createStoryModal');
        if (m && m.parentNode !== document.body) {
          document.body.appendChild(m);
        }
      });

      // ── GLOBAL story modal helpers (must be outside IIFE so onclick works) ──
      function openCreateStory(event) {
        if (event) event.stopPropagation();

        // Close any other open modal first
        var profileEdit = document.getElementById('profileEditModal');
        if (profileEdit) profileEdit.style.display = 'none';

        var modal = document.getElementById('createStoryModal');
        if (!modal) return;

        // Use requestAnimationFrame to ensure browser handles the close first
        requestAnimationFrame(function() {
          modal.setAttribute('style',
            'display:flex !important;' +
            'position:fixed;' +
            'top:0;left:0;right:0;bottom:0;' +
            'z-index:30000;' +
            'background:rgba(0,0,0,0.88);' +
            '-webkit-backdrop-filter:blur(10px);' +
            'backdrop-filter:blur(10px);' +
            'align-items:center;' +
            'justify-content:center;'
          );

          var txt = document.getElementById('storyTextInput');
          if (txt) txt.value = '';
          if (typeof clearStoryMedia === 'function') clearStoryMedia();
          setTimeout(function () { if (txt) txt.focus(); }, 150);
        });
      }

      function closeCreateStory() {
        var modal = document.getElementById('createStoryModal');
        if (modal) modal.setAttribute('style', 'display:none;');
        if (typeof clearStoryMedia === 'function') clearStoryMedia();
      }

      // Smart handler for "Your Story" bubble
      // Smart handler for "Your Story" bubble
      function handleMyStoryClick(event) {
        if (event) event.stopPropagation();
        if (!window.currentUser) return;

        // Optimization: Use the visual state of the ring to decide
        // If the + button is hidden, it means we definitely have a story
        var addBtn = document.getElementById('myStoryAddBtn');
        var hasStory = addBtn && addBtn.style.display === 'none';

        if (hasStory) {
          if (typeof loadUserStories === 'function') {
            loadUserStories(
              window.currentUser.handle,
              window.currentUser.name,
              window.currentUser.photo
            );
          }
        } else {
          // No active story - open creator
          if (typeof openCreateStory === 'function') openCreateStory(event);
        }
      }
    </script>

    <!-- STORIES IIFE -->
    <script>
      (function () {
        'use strict';

        // ── local state ──────────────────────────────────────────────
        var _stories = [];
        var _storyIdx = 0;
        var _storyTimer = null;
        var _mediaPendingUrl = null;
        var _mediaPendingType = null;

        // safe formatTime — falls back if the main-script version isn't ready yet
        function _fmtTime(ms) {
          if (typeof formatTime === 'function') return formatTime(ms);
          if (!ms) return '';
          var diff = Date.now() - ms;
          if (diff < 60000) return 'just now';
          if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
          if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
          return new Date(ms).toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        // ── tray loader ─────────────────────────────────────────────
        window.fetchStoriesFeed = function () {
          fetch('/api/stories/feed')
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (users) {
              var tray = document.getElementById('storiesTray');
              if (!tray) return;

              var yourRing = tray.firstElementChild;
              tray.innerHTML = '';
              if (yourRing) tray.appendChild(yourRing);
              
              if (Array.isArray(users)) {
                var myHandle = window.currentUser && window.currentUser.handle;
                // Normalize handles for comparison (strip @ if present)
                var cleanMyHandle = myHandle ? myHandle.replace(/^@/, '') : '';
                
                var iHaveStory = users.some(function (u) { 
                  var cleanU = u.handle.replace(/^@/, '');
                  return cleanU === cleanMyHandle; 
                });

                var addBtn = document.getElementById('myStoryAddBtn');
                var myRing = document.getElementById('myStoryRing');
                var myLabel = document.getElementById('myStoryLabel');

                if (iHaveStory) {
                  // Show glowing ring indicating active story
                  if (myRing) myRing.style.background = 'linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888)';
                  if (addBtn) addBtn.style.display = 'none'; // hide the + when story exists
                  if (myLabel) myLabel.textContent = 'Your Story ✓';
                } else {
                  if (myRing) myRing.style.background = 'var(--border)';
                  if (addBtn) addBtn.style.display = 'flex';
                  if (myLabel) myLabel.textContent = 'Your Story';
                }
              }

              if (!Array.isArray(users) || users.length === 0) return;

              users.forEach(function (u) {
                // Skip current user — their bubble is always shown as "Your Story"
                var cleanU = u.handle.replace(/^@/, '');
                var cleanMyHandle = (window.currentUser && window.currentUser.handle || '').replace(/^@/, '');
                if (cleanU === cleanMyHandle) return;

                var el = document.createElement('div');
                el.className = 'story-avatar-wrap';
                el.onclick = function () { loadUserStories(u.handle, u.name, u.photo); };

                var imgHtml = u.photo
                  ? '<img src="' + u.photo + '" style="width:56px;height:56px;border-radius:50%;border:2px solid #000;object-fit:cover;">'
                  : '<div class="mini-avatar" style="width:56px;height:56px;">' + ((u.name || u.handle)[0] || '?').toUpperCase() + '</div>';

                el.innerHTML = '<div class="story-ring">' + imgHtml + '</div>'
                  + '<div class="story-handle">' + (u.handle || '') + '</div>';
                tray.appendChild(el);
              });
            })
            .catch(function (err) {
              console.warn('[Stories] fetchStoriesFeed error:', err);
            });
        };

        // ── load a user's active stories ────────────────────────────
        window.loadUserStories = function (handle, name, photo) {
          if (!handle) return;
          fetch('/api/stories/' + encodeURIComponent(handle))
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.json();
            })
            .then(function (stories) {
              if (!Array.isArray(stories) || stories.length === 0) {
                if (typeof showNotif === 'function') showNotif('No active stories.');
                return;
              }
              _stories = stories;
              _storyIdx = 0;

              document.getElementById('storyViewerName').textContent = name || handle;
              document.getElementById('storyViewerAvatarWrap').innerHTML = photo
                ? '<img src="' + photo + '" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">'
                : '<div class="mini-avatar" style="width:36px;height:36px;font-size:14px;">' + ((name || handle)[0] || '?').toUpperCase() + '</div>';

              // Close any open modals first
              if (typeof closeCreateStory === 'function') closeCreateStory();
              var pEdit = document.getElementById('profileEditModal');
              if (pEdit) pEdit.style.display = 'none';

              // Navigate to storyView tab (same as switchTab but direct to avoid event ref)
              var _allV = ['feedView','exploreView','aiView','profileView','messagesView','chatView','notificationsView','threadView','storyView','followListView'];
              _allV.forEach(function(v){ var e=document.getElementById(v); if(e) e.style.display='none'; });
              var sv = document.getElementById('storyView');
              if (sv) sv.style.display = 'flex';
              _renderStory();
            })
            .catch(function (err) {
              console.warn('[Stories] loadUserStories error:', err);
              if (typeof showNotif === 'function') showNotif('Could not load stories.');
            });
        };

        // ── render current story ────────────────────────────────────
        function _renderStory() {
          if (_storyIdx >= _stories.length) {
            closeStory();
            return;
          }

          var s = _stories[_storyIdx];
          var container = document.getElementById('storyMediaContainer');
          container.innerHTML = '';
          document.getElementById('storyText').textContent = s.text || '';
          document.getElementById('storyViewerTime').textContent = _fmtTime(s.timestamp);

          var likeIcon = document.getElementById('storyLikeIcon');
          var likeCount = document.getElementById('storyLikesCount');
          var commCount = document.getElementById('storyCommentsCount');
          var ownerActions = document.getElementById('storyOwnerActions');
          if (likeIcon && likeCount && commCount) {
            likeIcon.textContent = s.user_liked ? '❤️' : '🤍';
            likeCount.textContent = s.likes_count || 0;
            commCount.textContent = s.comments_count || 0;
          }
          if (ownerActions) {
            var isSelf = window.currentUser && (s.user_handle === window.currentUser.handle || s.user_handle === '@' + window.currentUser.handle.replace('@',''));
            ownerActions.style.display = isSelf ? 'flex' : 'none';
          }

          // rebuild progress bar
          var pb = document.getElementById('storyProgressBar');
          pb.innerHTML = '';
          _stories.forEach(function (_, i) {
            pb.innerHTML +=
              '<div class="story-progress-segment">'
              + '<div class="story-progress-fill" id="storyFill' + i + '"></div>'
              + '</div>';
          });
          // instantly fill completed segments
          for (var j = 0; j < _storyIdx; j++) {
            var f = document.getElementById('storyFill' + j);
            if (f) { f.style.transition = 'none'; f.style.width = '100%'; }
          }

          clearTimeout(_storyTimer);
          var duration = 5000;

          if (s.media_url) {
            if (s.media_type === 'video') {
              var vid = document.createElement('video');
              vid.src = s.media_url;
              vid.className = 'story-media';
              vid.autoplay = true;
              vid.playsInline = true;
              vid.controls = false;
              vid.style.maxWidth = '100%';
              vid.style.maxHeight = '100%';
              vid.style.objectFit = 'contain';
              vid.onended = function () { nextStory(); };
              vid.onloadedmetadata = function () {
                duration = (vid.duration || 5) * 1000;
                _startProgress(duration);
              };
              container.appendChild(vid);
              vid.play().catch(function () { });
            } else {
              var img = document.createElement('img');
              img.src = s.media_url;
              img.className = 'story-media';
              img.style.maxWidth = '100%';
              img.style.maxHeight = '100%';
              img.style.objectFit = 'contain';
              container.appendChild(img);
              requestAnimationFrame(function () {
                _startProgress(duration);
                _storyTimer = setTimeout(function () { nextStory(); }, duration);
              });
            }
          } else {
            // text-only story
            requestAnimationFrame(function () {
              _startProgress(duration);
              _storyTimer = setTimeout(function () { nextStory(); }, duration);
            });
          }
        }

        function _startProgress(duration) {
          var fill = document.getElementById('storyFill' + _storyIdx);
          if (!fill) return;
          fill.style.transition = 'none';
          fill.style.width = '0%';
          void fill.offsetWidth; // force reflow
          fill.style.transition = 'width ' + duration + 'ms linear';
          fill.style.width = '100%';
        }

        var _storyTimerPaused = false;

        // ── public nav functions ─────────────────────────────────────
        window.likeCurrentStory = function(e) {
          if (e) e.stopPropagation();
          var s = _stories[_storyIdx];
          if (!s) return;
          fetch('/api/stories/' + s.id + '/like', { method: 'POST' })
            .then(function(r){ return r.json(); })
            .then(function(data){
              if (data.success) {
                s.user_liked = data.liked;
                s.likes_count = data.likes_count;
                var likeIcon = document.getElementById('storyLikeIcon');
                var likeCount = document.getElementById('storyLikesCount');
                if (likeIcon) likeIcon.textContent = data.liked ? '❤️' : '🤍';
                if (likeCount) likeCount.textContent = data.likes_count;
              }
            });
        };

        window.toggleStoryComments = function(e) {
          if (e) e.stopPropagation();
          var drawer = document.getElementById('storyCommentsDrawer');
          if (!drawer) return;
          if (drawer.style.display === 'flex') {
            drawer.style.display = 'none';
            if (_storyTimerPaused) {
              _storyTimer = setTimeout(function(){ nextStory(); }, 3000);
              _storyTimerPaused = false;
            }
          } else {
            clearTimeout(_storyTimer);
            _storyTimerPaused = true;
            drawer.style.display = 'flex';
            loadStoryComments();
          }
        };

        window.loadStoryComments = function() {
          var s = _stories[_storyIdx];
          if (!s) return;
          var list = document.getElementById('storyCommentsList');
          var count = document.getElementById('drawerCommentsCount');
          if (!list) return;
          list.innerHTML = '<div style="text-align:center; padding:24px; color:var(--text-dim);">Loading comments...</div>';
          fetch('/api/stories/' + s.id + '/comments')
            .then(function(r){ return r.json(); })
            .then(function(comments){
              if (count) count.textContent = comments.length;
              if (comments.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:32px; color:var(--text-dim);">No comments yet. Start the conversation!</div>';
                return;
              }
              list.innerHTML = comments.map(function(c){
                return '<div style="display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.05);">'
                  + (c.user_photo ? '<img src="'+c.user_photo+'" style="width:36px; height:36px; border-radius:50%; object-fit:cover; flex-shrink:0;">' : '<div class="mini-avatar" style="width:36px; height:36px; font-size:14px;">'+(c.user_name || 'U')[0].toUpperCase()+'</div>')
                  + '<div style="flex:1; min-width:0;">'
                  + '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px;">'
                  + '<span style="font-weight:700; font-size:14px; color:#fff;">'+c.user_name+'</span>'
                  + '<span style="font-size:11px; color:var(--text-dim);">'+_fmtTime(c.timestamp)+'</span>'
                  + '</div>'
                  + '<div style="font-size:14px; color:#ddd; line-height:1.4; word-break:break-word;">'+c.text+'</div>'
                  + '</div></div>';
              }).join('');
              list.scrollTop = list.scrollHeight;
            });
        };

        window.postStoryComment = function() {
          var s = _stories[_storyIdx];
          if (!s) return;
          var input = document.getElementById('storyCommentInput');
          var text = (input ? input.value : '').trim();
          if (!text) return;
          if (input) input.value = '';
          
          fetch('/api/stories/' + s.id + '/comments', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
          })
          .then(function(r){ return r.json(); })
          .then(function(data){
            if (data.success) {
              s.comments_count = data.comments_count;
              var commCount = document.getElementById('storyCommentsCount');
              if (commCount) commCount.textContent = data.comments_count;
              loadStoryComments();
            }
          });
        };

        window.deleteCurrentStory = function(e) {
          if (e) e.stopPropagation();
          var s = _stories[_storyIdx];
          if (!s) return;
          if (confirm("Delete this story? This cannot be undone.")) {
            fetch('/api/stories/' + s.id, { method: 'DELETE' })
              .then(function(r){ return r.json(); })
              .then(function(data){
                if (data.success) {
                  closeStory();
                  if (typeof showNotif === 'function') showNotif('Story deleted');
                }
              });
          }
        };

        window.nextStory = function (e) {
          if (e) e.stopPropagation();
          clearTimeout(_storyTimer);
          _storyIdx++;
          _renderStory();
        };

        window.prevStory = function (e) {
          if (e) e.stopPropagation();
          clearTimeout(_storyTimer);
          if (_storyIdx > 0) { _storyIdx--; _renderStory(); }
        };

        window.closeStory = function () {
          clearTimeout(_storyTimer);
          var container = document.getElementById('storyMediaContainer');
          if (container) {
            var vid = container.querySelector('video');
            if (vid) { vid.pause(); vid.src = ''; }
            container.innerHTML = '';
          }
          var st = document.getElementById('storyText');
          if (st) st.textContent = '';
          // Go back to Home feed
          if (typeof switchTab === 'function') {
            switchTab('feedView');
          } else {
            var _allV = ['feedView','exploreView','aiView','profileView','messagesView','chatView','notificationsView','threadView','storyView','followListView'];
            _allV.forEach(function(v){ var e=document.getElementById(v); if(e) e.style.display='none'; });
            var home = document.getElementById('feedView');
            if (home) home.style.display = 'flex';
            var fab = document.querySelector('.post-btn-fab');
            if (fab) fab.classList.remove('fab-hidden');
          }
          // Re-activate Home nav item
          document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.remove('active'); });
          var homeNav = document.getElementById('mobileNavHome');
          if (homeNav) homeNav.classList.add('active');
        };

        // ── create story modal — handled by global functions above IIFE ──
        // openCreateStory() and closeCreateStory() are global, defined in the script tag above.

        // ── media select — upload immediately, store URL ─────────────
        window.handleStoryMediaSelect = function (e) {
          var file = e.target.files[0];
          if (!file) return;

          _mediaPendingUrl = null;
          _mediaPendingType = null;

          var previewArea = document.getElementById('storyPreviewArea');
          var imgEl = document.getElementById('storyPreviewImg');
          var vidEl = document.getElementById('storyPreviewVid');
          var progressBox = document.getElementById('storyUploadProgress');
          var bar = document.getElementById('storyUploadBar');
          var label = document.getElementById('storyUploadLabel');

          previewArea.style.display = 'flex';
          imgEl.style.display = 'none';
          vidEl.style.display = 'none';
          progressBox.style.display = 'block';
          bar.style.width = '0%';
          label.textContent = 'Uploading…';

          var fd = new FormData();
          fd.append('media', file);
          fd.append('type', 'post');   // reuse your existing /upload route

          var xhr = new XMLHttpRequest();
          xhr.open('POST', '/upload', true);

          xhr.upload.onprogress = function (ev) {
            if (ev.lengthComputable) {
              bar.style.width = Math.round(ev.loaded / ev.total * 100) + '%';
            }
          };

          xhr.onload = function () {
            progressBox.style.display = 'none';
            if (xhr.status === 200) {
              try {
                var d = JSON.parse(xhr.responseText);
                if (d.url) {
                  _mediaPendingUrl = d.url;
                  _mediaPendingType = d.type; // 'image' or 'video'
                  if (d.type === 'video') {
                    vidEl.src = d.url;
                    vidEl.style.display = 'block';
                  } else {
                    imgEl.src = d.url;
                    imgEl.style.display = 'block';
                  }
                } else {
                  if (typeof showNotif === 'function') showNotif('Upload failed: ' + (d.error || 'unknown'));
                  clearStoryMedia();
                }
              } catch (ex) {
                if (typeof showNotif === 'function') showNotif('Upload response error');
                clearStoryMedia();
              }
            } else {
              if (typeof showNotif === 'function') showNotif('Upload failed (' + xhr.status + ')');
              clearStoryMedia();
            }
          };

          xhr.onerror = function () {
            progressBox.style.display = 'none';
            if (typeof showNotif === 'function') showNotif('Network error during upload');
            clearStoryMedia();
          };

          xhr.send(fd);
          // reset value at start so the same file can be re-picked after a clear
          e.target.value = '';
        };

        window.clearStoryMedia = function () {
          _mediaPendingUrl = null;
          _mediaPendingType = null;
          var previewArea = document.getElementById('storyPreviewArea');
          var imgEl = document.getElementById('storyPreviewImg');
          var vidEl = document.getElementById('storyPreviewVid');
          var progressBox = document.getElementById('storyUploadProgress');
          var input = document.getElementById('storyMediaInput');

          if (previewArea) previewArea.style.display = 'none';
          if (imgEl) { imgEl.style.display = 'none'; imgEl.src = ''; }
          if (vidEl) { vidEl.style.display = 'none'; if (vidEl.pause) vidEl.pause(); vidEl.src = ''; }
          if (progressBox) progressBox.style.display = 'none';
          if (input) input.value = '';
        };

        // ── post the story ────────────────────────────────────────────
        // Uses your EXISTING /upload route with type='story'
        // Your Flask handler should detect type==='story' and save a story record
        window.postStory = function () {
          var textVal = (document.getElementById('storyTextInput').value || '').trim();

          if (!textVal && !_mediaPendingUrl) {
            if (typeof showNotif === 'function') showNotif('Add a caption or choose a photo/video first.');
            return;
          }

          var btn = document.getElementById('postStoryBtn');
          btn.disabled = true;
          btn.textContent = 'Posting…';

          // ── Strategy A: if media was already uploaded, just POST the metadata ──
          // This calls /api/stories which your Flask server may or may not have.
          // We also try /upload with type=story as a fallback (Strategy B below).
          var payload = {
            text: textVal,
            media_url: _mediaPendingUrl || null,
            media_type: _mediaPendingType || null
          };

          // Check whether /api/stories exists by just calling it
          fetch('/api/stories', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          })
            .then(function (r) {
              // If server returns 404 / 405 the route doesn't exist — fall back
              if (r.status === 404 || r.status === 405) {
                return _postStoryViaUpload(textVal, btn);
              }
              return r.json().then(function (d) {
                btn.disabled = false;
                btn.textContent = 'Post Story';
                if (d.success || d.id || d.story_id) {
                  _afterPost();
                } else {
                  // If the API returned an error, fall back to /upload
                  _postStoryViaUpload(textVal, btn);
                }
              });
            })
            .catch(function () {
              // Network or parse error — fall back to /upload
              _postStoryViaUpload(textVal, btn);
            });
        };

        // Fallback: post story via your existing /upload endpoint with type=story
        function _postStoryViaUpload(textVal, btn) {
          var fd = new FormData();
          fd.append('type', 'story');
          fd.append('text', textVal);
          if (_mediaPendingUrl) fd.append('media_url', _mediaPendingUrl);
          if (_mediaPendingType) fd.append('media_type', _mediaPendingType);
          // If there is still a raw file chosen, attach it
          var fileInput = document.getElementById('storyMediaInput');
          if (fileInput && fileInput.files && fileInput.files[0]) {
            fd.append('media', fileInput.files[0]);
          }

          fetch('/upload', { method: 'POST', body: fd })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              btn.disabled = false;
              btn.textContent = 'Post Story';
              if (d.success || d.url || d.story_id) {
                _afterPost();
              } else {
                if (typeof showNotif === 'function') showNotif(d.error || 'Failed to post story.');
              }
            })
            .catch(function () {
              btn.disabled = false;
              btn.textContent = 'Post Story';
              if (typeof showNotif === 'function') showNotif('Network error — story not posted.');
            });
        }

        function _afterPost() {
          closeCreateStory();
          if (typeof showNotif === 'function') showNotif('Story posted! 🌿');
          // Refresh the tray
          if (typeof fetchStoriesFeed === 'function') fetchStoriesFeed();
        }

        // ── boot: load tray after page settles ─────────────────────
        if (window.currentUser) {
          setTimeout(window.fetchStoriesFeed, 900);
        }

      })(); // end IIFE — no globals leaked except the window.* assignments above
    </script>
