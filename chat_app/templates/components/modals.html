<!-- PROFILE EDIT MODAL -->
  <div id="profileEditModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:20000; align-items:center; justify-content:center; backdrop-filter:blur(12px);">
    <div
      style="background:var(--bg); border:1px solid var(--border); border-radius:32px; padding:32px; width:90%; max-width:440px; box-shadow:0 0 50px rgba(0,0,0,0.5);">
      <h2 style="margin:0 0 24px 0; font-size:26px; color:var(--text-main); font-weight:700;">Edit Profile</h2>

      <div style="text-align:center; margin-bottom:24px;">
        <div id="cropContainer"
          style="width:140px; height:140px; margin:0 auto 20px auto; border-radius:50%; overflow:hidden; background:var(--surface-bright); border:2px solid var(--accent); box-shadow:0 0 20px var(--accent-glow);">
          <img id="profileCropImage" style="max-width:100%; display:none;">
        </div>
        <input type="file" id="profilePhotoInput" accept="image/*" style="display:none;"
          onchange="loadProfilePhoto(event)">
        <button class="node-pill"
          style="padding:8px 20px; font-size:13px; border-color:var(--accent); color:var(--accent);"
          onclick="document.getElementById('profilePhotoInput').click()">Change Photo</button>
      </div>

      <div style="margin-bottom:16px;">
        <label
          style="display:block; font-size:13px; color:var(--text-dim); margin-bottom:8px; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Display
          Name</label>
        <input type="text" id="editProfileName"
          style="width:100%; padding:14px; border-radius:16px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text-main); outline:none; font-size:15px; font-family:inherit;">
      </div>

      <div style="margin-bottom:24px;">
        <label
          style="display:block; font-size:13px; color:var(--text-dim); margin-bottom:8px; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Bio</label>
        <textarea id="editProfileBio"
          style="width:100%; padding:14px; border-radius:16px; border:1px solid var(--border); background:rgba(255,255,255,0.05); color:var(--text-main); outline:none; font-size:15px; font-family:inherit; resize:vertical; min-height:100px;"></textarea>
      </div>

      <div
        style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; padding:16px; background:var(--cream); border-radius:12px;">
        <div>
          <div style="font-weight:600; font-size:15px; color:var(--earth1);">Private Profile</div>
          <div style="font-size:13px; color:var(--stone); margin-top:2px;">Hide your posts from the global feed</div>
        </div>
        <label class="toggle-switch" style="position:relative; display:inline-block; width:50px; height:28px;">
          <input type="checkbox" id="editProfilePrivate" style="opacity:0; width:0; height:0;">
          <span class="toggle-slider"
            style="position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:var(--stone); transition:.4s; border-radius:34px;">
            <span class="toggle-knob"
              style="position:absolute; height:20px; width:20px; left:4px; bottom:4px; background-color:white; transition:.4s; border-radius:50%;"></span>
          </span>
        </label>
      </div>

      <button class="btn-primary" style="width:100%; padding:16px; border-radius:16px; font-size:16px;"
        onclick="saveProfile()" id="saveProfileBtn">Save Profile</button>
      <button
        style="width:100%; padding:16px; background:none; border:none; color:var(--stone); margin-top:8px; cursor:pointer;"
        onclick="document.getElementById('profileEditModal').style.display='none'">Cancel</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script id="user-data"
      type="application/json">{{ current_user | tojson | safe if current_user else "null" }}</script>
    <script>
      // --- GLOBAL VARS & SETUP ---
      function optimizeCloudinaryUrl(url, type='post') {
        if (!url || !url.includes('res.cloudinary.com') || !url.includes('/upload/')) return url;
        let transforms = "f_auto,q_auto";
        if (type === 'profile') transforms = "w_400,h_400,c_thumb,g_face,f_auto,q_auto";
        else if (type === 'cover') transforms = "w_900,h_300,c_fill,g_auto,f_auto,q_auto";
        
        if (url.includes(`/upload/${transforms}/`)) return url;
        const parts = url.split('/upload/');
        return `${parts[0]}/upload/${transforms}/${parts[1]}`;
      }

      const socket = io();
      const currentUser = JSON.parse(document.getElementById('user-data').textContent);
      window.currentUser = currentUser; // expose to story IIFE

      let replyingToPostId = null;
      let ALL_POSTS = [];
      let cropper = null;

      // --- INITIALIZE ---
      if (currentUser) {
        socket.emit('join', currentUser);

      }

      socket.on('delete_post', (data) => {
        // Remove from ALL_POSTS cache
        ALL_POSTS = ALL_POSTS.filter(p => p.id !== data.id);
        // Remove card from every rendered area
        document.querySelectorAll(`#post-${data.id}`).forEach(el => el.remove());
      });

      socket.on('edit_post', (data) => {
        // Update cache
        const cached = ALL_POSTS.find(p => p.id === data.id);
        if (cached) cached.text = data.text;
        // Update rendered text in every area
        document.querySelectorAll(`#post-${data.id} .post-text`).forEach(el => {
          el.innerHTML = formatRichText(data.text);
        });
      });

      let displayedPostsCount = 0;
      const POSTS_PER_PAGE = 15;

      socket.on('initial_posts', (posts) => {
        ALL_POSTS = posts;
        displayedPostsCount = 0;
        const area = document.getElementById('postsArea');
        if (area) {
          area.innerHTML = '';
          const empty = document.getElementById('feedEmptyState');
          if (empty) empty.style.display = posts.length === 0 ? 'block' : 'none';
          if (posts.length > 0) loadMorePosts();
        }
      });

      function loadMorePosts() {
        const area = document.getElementById('postsArea');
        if (!area) return;
        const nextPosts = ALL_POSTS.slice(displayedPostsCount, displayedPostsCount + POSTS_PER_PAGE);
        if (nextPosts.length === 0) return;
        const empty = document.getElementById('feedEmptyState');
        if (empty) empty.style.display = 'none';
        nextPosts.forEach(p => addPostToFeed(p, false, 'postsArea'));
        displayedPostsCount += nextPosts.length;
      }

      document.getElementById('postsArea')?.addEventListener('scroll', function () {
        if (this.scrollTop + this.clientHeight >= this.scrollHeight - 400) {
          loadMorePosts();
        }
      });

      socket.on('receive_post', (post) => {
        // Keep global state updated
        const exists = ALL_POSTS.find(p => p.id === post.id);
        if (!exists) {
          ALL_POSTS.unshift(post);
          displayedPostsCount++;

          // Add to global feed if on For You tab
          if (currentFeedTab === 'ForYou') {
            addPostToFeed(post, true, 'postsArea');
          }
          // Add to Following feed if on Following tab AND we follow the sender (or it's us)
          else if (currentFeedTab === 'Following') {
            const isOwn = currentUser && post.handle === currentUser.handle;
            // We don't have the full following list here, but we can optimistically show own posts
            if (isOwn) {
              addPostToFeed(post, true, 'postsArea');
            }
          }
        }

        // If viewing profile, also render there if it matches
        const pView = document.getElementById('profileView');
        if (pView && pView.style.display === 'flex') {
          const currentProfile = document.getElementById('profileViewHandle').innerText;
          if (!exists && (post.handle === currentProfile || post.retweetedFrom === currentProfile)) {
            addPostToFeed(post, true, 'profilePostsArea');
          }
        }
      });

      socket.on('update_likes', (data) => {
        const likeCountSpan = document.getElementById(`like-count-${data.id}`);
        const likeBtn = document.getElementById(`like-btn-${data.id}`);
        if (likeCountSpan) {
          likeCountSpan.textContent = data.likes > 0 ? data.likes : '';
          if (data.userLiked) {
            // Animate and mark as liked
            likeBtn.classList.remove('liked');
            void likeBtn.offsetWidth; // trigger reflow
            likeBtn.classList.add('liked');
          } else {
            // Unliked — remove styling
            likeBtn.classList.remove('liked');
          }
        }
      });

      // ── Utility: close every modal before opening a new one ──────────
      function closeAllModals() {
        // Only close modals we are NOT about to open
        var profileEdit = document.getElementById('profileEditModal');
        if (profileEdit) profileEdit.style.display = 'none';

        var storyModal = document.getElementById('createStoryModal');
        if (storyModal) storyModal.style.display = 'none';
      }

      // ── FIX 2 & FIX 3: openProfileEdit() ──────────────────────────
      // Shows current photo in crop circle instead of black empty circle
      function openProfileEdit() {
        closeAllModals();
        document.getElementById('profileEditModal').style.display = 'flex';
        if (currentUser) {
          document.getElementById('editProfileName').value = currentUser.name || '';
          document.getElementById('editProfileBio').value = currentUser.bio || '';
          document.getElementById('editProfilePrivate').checked = !!currentUser.is_private;

          const cropImg = document.getElementById('profileCropImage');
          const cropContainer = document.getElementById('cropContainer');

          // Remove any old letter placeholder
          const oldLetter = cropContainer.querySelector('.crop-initial');
          if (oldLetter) oldLetter.remove();

          if (currentUser.photo) {
            // Show current profile photo immediately
            cropImg.src = currentUser.photo;
            cropImg.style.display = 'block';
            cropImg.style.width = '100%';
            cropImg.style.height = '100%';
            cropImg.style.objectFit = 'cover';
            cropContainer.style.background = '';
          } else {
            // Show gradient background with initial letter
            cropImg.style.display = 'none';
            cropContainer.style.background = 'linear-gradient(135deg, #f09433, #dc2743, #bc1888)';
            const letter = document.createElement('span');
            letter.className = 'crop-initial';
            letter.textContent = (currentUser.name || 'U').charAt(0).toUpperCase();
            cropContainer.appendChild(letter);
          }

          // Destroy any stale cropper instance
          if (cropper) { cropper.destroy(); cropper = null; }
        }
      }

      function loadProfilePhoto(event) {
        const file = event.target.files[0];
        if (!file) return;

        const img = document.getElementById('profileCropImage');
        img.src = URL.createObjectURL(file);
        img.style.display = 'block';

        if (cropper) cropper.destroy();
        cropper = new Cropper(img, {
          aspectRatio: 1,
          viewMode: 1,
          autoCropArea: 1
        });
      }

      function saveProfile() {
        const btn = document.getElementById('saveProfileBtn');
        btn.innerText = 'Saving...';

        const nameVal = document.getElementById('editProfileName').value.trim();
        const bioVal = document.getElementById('editProfileBio').value.trim();
        const isPrivate = document.getElementById('editProfilePrivate').checked;

        const doSave = (formData) => {
          fetch('/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
              if (data.success) {
                // --- Update currentUser object in-memory ---
                currentUser.name = nameVal || currentUser.name;
                currentUser.bio = bioVal;
                currentUser.is_private = isPrivate;
                if (data.url) currentUser.photo = data.url;

                // --- Update navbar avatar ---
                const navAvatar = document.getElementById('navAvatar');
                if (currentUser.photo) {
                  if (navAvatar.tagName === 'DIV') {
                    // replace div with img
                    const img = document.createElement('img');
                    img.src = currentUser.photo;
                    img.className = 'mini-avatar';
                    img.id = 'navAvatar';
                    img.style.objectFit = 'cover';
                    navAvatar.replaceWith(img);
                  } else {
                    navAvatar.src = currentUser.photo;
                  }
                } else {
                  navAvatar.textContent = currentUser.name[0].toUpperCase();
                }

                // --- Update composer avatar ---
                const compAvatar = document.getElementById('composerAvatar');
                if (compAvatar && currentUser.photo) {
                  compAvatar.innerHTML = `<img src="${currentUser.photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
                } else if (compAvatar) {
                  compAvatar.textContent = currentUser.name[0].toUpperCase();
                }

                // --- If profile view is open for current user, update it too ---
                const pHandle = document.getElementById('profileViewHandle');
                if (pHandle && pHandle.innerText === currentUser.handle) {
                  document.getElementById('profileViewName').innerText = currentUser.name;
                  document.getElementById('profileViewBio').innerText = currentUser.bio;
                  const pAvatar = document.getElementById('profileViewAvatar');
                  if (pAvatar && currentUser.photo) pAvatar.src = currentUser.photo;
                }

                // --- Fix 5: Update all existing post-card avatars for this user in the feed ---
                if (data.url) {
                  document.querySelectorAll(`[data-post-handle="${currentUser.handle}"]`).forEach(el => {
                    el.src = data.url;
                  });
                }

                // Close modal and show toast
                document.getElementById('profileEditModal').style.display = 'none';
                showNotif('Profile updated! ✅');
                btn.innerText = 'Save Profile';

                // Destroy cropper so it doesn't linger
                if (cropper) { cropper.destroy(); cropper = null; }
                document.getElementById('profileCropImage').style.display = 'none';
              } else {
                showNotif('Save failed: ' + (data.error || 'Unknown error'));
                btn.innerText = 'Save Profile';
              }
            })
            .catch(() => {
              showNotif('Network error saving profile.');
              btn.innerText = 'Save Profile';
            });
        };

        if (!cropper) {
          const formData = new FormData();
          formData.append('type', 'profile');
          formData.append('name', nameVal);
          formData.append('bio', bioVal);
          formData.append('is_private', String(isPrivate));
          doSave(formData);
        } else {
          btn.innerText = 'Uploading...';
          cropper.getCroppedCanvas({ width: 400, height: 400 }).toBlob((blob) => {
            fetch('/api/sign_upload?type=profile')
              .then(r => r.json())
              .then(signData => {
                if (signData.error) {
                  showNotif('Signature error');
                  btn.innerText = 'Save Profile';
                  return;
                }

                const uploadData = new FormData();
                uploadData.append('file', blob, 'profile.jpg');
                uploadData.append('api_key', signData.api_key);
                uploadData.append('timestamp', signData.timestamp);
                uploadData.append('signature', signData.signature);
                uploadData.append('folder', signData.folder);

                fetch(`https://api.cloudinary.com/v1_1/${signData.cloud_name}/image/upload`, {
                  method: 'POST',
                  body: uploadData
                })
                  .then(r => r.json())
                  .then(cData => {
                    if (cData.secure_url) {
                      const formData = new FormData();
                      formData.append('type', 'profile');
                      formData.append('name', nameVal);
                      formData.append('bio', bioVal);
                      formData.append('is_private', String(isPrivate));
                      formData.append('media_url', cData.secure_url);
                      formData.append('media_type', 'image');
                      doSave(formData);
                    } else {
                      showNotif('Cloudinary upload failed');
                      btn.innerText = 'Save Profile';
                    }
                  })
                  .catch(() => {
                    showNotif('Upload network error');
                    btn.innerText = 'Save Profile';
                  });
              });
          }, 'image/jpeg', 0.92);
        }
      }

      // --- COMPOSER ---
      // --- POST MANAGEMENT ---
      function togglePostMenu(postId, btn) {
        // Close all other open menus first
        document.querySelectorAll('.post-menu-dropdown.open').forEach(d => {
          if (d.id !== `menu-${postId}`) d.classList.remove('open');
        });
        document.getElementById(`menu-${postId}`).classList.toggle('open');
        // Close on outside click
        const close = (e) => {
          if (!btn.closest('.post-menu-wrap').contains(e.target)) {
            document.getElementById(`menu-${postId}`)?.classList.remove('open');
            document.removeEventListener('click', close);
          }
        };
        setTimeout(() => document.addEventListener('click', close), 0);
      }

      function deletePost(postId) {
        document.getElementById(`menu-${postId}`)?.classList.remove('open');
        if (window.confirm('Delete this post? This cannot be undone.')) {
          fetch(`/api/post/${postId}`, { method: 'DELETE' })
            .then(r => r.json())
            .then(data => {
              if (data.error) showNotif('Error: ' + data.error);
              else showNotif('Post deleted 🗑️');
            });
        }
      }

      let editingPostId = null;
      function openEditPost(postId) {
        document.getElementById(`menu-${postId}`)?.classList.remove('open');
        editingPostId = postId;
        const cached = ALL_POSTS.find(p => p.id === postId);
        document.getElementById('editPostText').value = cached ? cached.text : '';
        document.getElementById('editPostModal').style.display = 'flex';
        document.getElementById('editPostModal').classList.add('open');
        document.getElementById('editPostText').focus();
      }

      function closeEditModal() {
        document.getElementById('editPostModal').style.display = 'none';
        document.getElementById('editPostModal').classList.remove('open');
        editingPostId = null;
      }

      function submitEditPost() {
        const newText = document.getElementById('editPostText').value.trim();
        if (!newText || !editingPostId) return;
        fetch(`/api/post/${editingPostId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: newText })
        })
          .then(r => r.json())
          .then(data => {
            if (data.error) showNotif('Error: ' + data.error);
            else { showNotif('Post updated ✅'); closeEditModal(); }
          });
      }

      function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = el.scrollHeight + 'px';
      }

      // Track liked post IDs so we can toggle state locally before server responds
      const likedPosts = new Set();

      function createPost() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text && !pendingMediaUrl) return;

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        socket.emit('create_post', {
          sender: currentUser.name,
          handle: currentUser.handle,
          text: text,
          mediaUrl: pendingMediaUrl,
          mediaType: pendingMediaType,
          parentId: replyingToPostId,
          node: document.getElementById('nodeSelect').value
        });

        input.value = '';
        input.style.height = 'auto';
        input.placeholder = "What is happening?!";
        pendingMediaUrl = null;
        pendingMediaType = null;
        replyingToPostId = null;
        cancelUpload();
        showNotif('Your post was sent! 🌿');
        // Re-enable after a short delay to prevent double-posting
        setTimeout(() => { btn.disabled = false; }, 1000);
      }

      // ── FIX 5 & 6: likePost() with SVG heart animation ─────────────
      function likePost(postId, btnEl) {
        const isLiked = likedPosts.has(postId);
        const countSpan = document.getElementById(`like-count-${postId}`);
        const heartSvg = btnEl.querySelector('.heart-svg');
        let currentCount = parseInt(countSpan.textContent) || 0;

        if (isLiked) {
          likedPosts.delete(postId);
          btnEl.classList.remove('liked');
          btnEl.setAttribute('aria-pressed', 'false');
          countSpan.textContent = currentCount > 1 ? currentCount - 1 : '';
          if (heartSvg) {
            heartSvg.setAttribute('fill', 'none');
            heartSvg.setAttribute('stroke', 'currentColor');
          }
        } else {
          likedPosts.add(postId);
          btnEl.classList.add('liked');
          btnEl.setAttribute('aria-pressed', 'true');
          countSpan.textContent = currentCount + 1;
          if (heartSvg) {
            heartSvg.setAttribute('fill', '#ed4956');
            heartSvg.setAttribute('stroke', '#ed4956');
          }
        }
        socket.emit('like_post', postId);
      }

      function replyToPost(postId, handle) {
        replyingToPostId = postId;
        const input = document.getElementById('msgInput');
        input.placeholder = `Replying to ${handle}...`;
        input.focus();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function retweetPost(postId) {
        socket.emit('create_post', {
          sender: currentUser.name,
          handle: currentUser.handle,
          isRetweet: true,
          originalPostId: postId
        });
        showNotif('Rerooted! 🔁');
      }

      // ── FIX 5: bookmarkPost() with SVG fill ─────────────────────────
      const bookmarkedPosts = new Set();
      function bookmarkPost(postId, btnEl) {
        if (bookmarkedPosts.has(postId)) {
          bookmarkedPosts.delete(postId);
          btnEl.classList.remove('bookmarked');
          showNotif('Removed from Bookmarks');
        } else {
          bookmarkedPosts.add(postId);
          btnEl.classList.add('bookmarked');
          showNotif('Saved to Bookmarks! 🔖');
        }
        socket.emit('bookmark_post', postId);
      }

      function showSkeletons(targetId = 'postsArea', count = 3) {
        const area = document.getElementById(targetId);
        if (!area) return;
        let html = '';
        for (let i = 0; i < count; i++) {
          html += `
          <div class="post-card" style="pointer-events: none;">
            <div style="display:flex; flex-direction:column; width:100%">
              <div style="display:flex; gap:16px;">
                <div class="post-avatar skeleton-earthy" style="background: transparent;"></div>
                <div class="post-content">
                  <div class="post-header" style="gap:12px; margin-bottom: 12px; display: flex;">
                    <div class="skeleton-earthy" style="height: 16px; width: 120px; border-radius: 8px;"></div>
                    <div class="skeleton-earthy" style="height: 16px; width: 80px; border-radius: 8px;"></div>
                  </div>
                  <div class="skeleton-earthy" style="height: 16px; width: 100%; border-radius: 8px; margin-bottom: 8px;"></div>
                  <div class="skeleton-earthy" style="height: 16px; width: 80%; border-radius: 8px; margin-bottom: 16px;"></div>
                  <div class="skeleton-earthy" style="height: 200px; width: 100%; border-radius: 16px; margin-bottom: 16px;"></div>
                </div>
              </div>
            </div>
          </div>
        `;
        }
        area.innerHTML = html;
      }

      let currentFeedTab = 'ForYou';
      let followingPosts = []; // cache for following tab
      let followingOldestTimestamp = null; // cursor for pagination
      let followingHasMore = false;
      let followingLoading = false;

      function loadFollowingPosts(before = null) {
        if (followingLoading) return;
        followingLoading = true;
        const area = document.getElementById('postsArea');
        const loadMoreBtn = document.getElementById('followingLoadMoreBtn');
        if (loadMoreBtn) loadMoreBtn.disabled = true;

        const url = before ? `/api/posts/following?before=${before}` : '/api/posts/following';
        fetch(url)
          .then(r => r.json())
          .then(data => {
            followingLoading = false;
            const posts = data.posts || [];
            followingHasMore = data.has_more || false;

            if (!before && posts.length === 0) {
              area.innerHTML = `
                <div style="text-align:center; padding:48px; color:var(--stone);">
                  <div style="font-size:48px; margin-bottom:16px;">🌱</div>
                  <div style="font-size:18px; font-weight:600; color:var(--earth1);">Nothing here yet</div>
                  <div style="font-size:14px; margin-top:8px;">Follow people to see their posts here.</div>
                </div>`;
              return;
            }

            // On first load, clear skeletons before rendering real posts
            if (!before) {
              area.innerHTML = '';
            }

            // Remove old load-more button before appending new posts
            const oldBtn = document.getElementById('followingLoadMoreBtn');
            if (oldBtn) oldBtn.remove();

            posts.forEach(p => addPostToFeed(p, false, 'postsArea'));

            if (posts.length > 0) {
              followingOldestTimestamp = posts[posts.length - 1].timestamp;
            }

            // Add Load More button if there are more posts
            if (followingHasMore) {
              const btn = document.createElement('div');
              btn.id = 'followingLoadMoreBtn';
              btn.innerHTML = `<button onclick="loadFollowingPosts(followingOldestTimestamp)" style="display:block; margin:16px auto 32px; padding:12px 32px; border-radius:20px; background:var(--surface-bright); border:1px solid var(--border); color:var(--text-main); font-size:14px; font-weight:600; cursor:pointer;">Load older posts ↓</button>`;
              area.appendChild(btn);
            } else if (posts.length > 0) {
              const end = document.createElement('div');
              end.style = 'text-align:center;padding:24px;color:var(--stone);font-size:13px;';
              end.textContent = "You've seen all posts 🌿";
              area.appendChild(end);
            }
          })
          .catch(() => { followingLoading = false; });
      }

      function switchFeedTab(tab) {
        currentFeedTab = tab;

        // Update tab indicator styles

        if (currentTab !== 'feedView') {
          switchTab('feedView', false);

            showToast("Press back again to exit");

      function decodeHtmlEntities(str) {
        if (!str) return '';
        const txt = document.createElement("textarea");
        txt.innerHTML = str;
        return txt.value;
      }

      function formatRichText(text) {
        if (!text) return '';
        const decoded = decodeHtmlEntities(text);
        // Escape HTML
        let safeText = decoded.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

        const urls = [];
        const urlRegex = /(https?:\/\/[^\s]+)/g;
        safeText = safeText.replace(urlRegex, match => {
          urls.push(match);
          return `__URL_${urls.length - 1}__`;
        });

        safeText = safeText.replace(/@([a-zA-Z0-9_]+)/g, (match, handle) => {
          return `<span class="rich-mention" style="color:var(--green3); cursor:pointer; font-weight:600;" onclick="event.stopPropagation(); openProfile('${handle}', '${handle}')">${match}</span>`;
        });

        safeText = safeText.replace(/#([a-zA-Z0-9_]+)/g, (match, tag) => {
          return `<span class="rich-hashtag" style="color:var(--green3); cursor:pointer; font-weight:600;" onclick="event.stopPropagation(); document.getElementById('searchExplore').value='${match}'; switchTab('explore'); filterExplorePosts();">${match}</span>`;
        });

        safeText = safeText.replace(/__URL_(\d+)__/g, (match, i) => {
          const url = urls[i];
          return `<a href="${url}" target="_blank" onclick="event.stopPropagation();" class="rich-link" style="color:var(--green3); text-decoration:none;">${url}</a>`;
        });

        safeText = safeText.replace(/\n/g, '<br>');
        return safeText;
      }

      // --- UPLOAD ---
      let pendingMediaUrl = null;
      let pendingMediaType = null;

      function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const pct = document.getElementById('uploadPct');
        const bar = document.getElementById('uploadBar');
        const preview = document.getElementById('uploadPreview');
        const icon = document.getElementById('uploadIcon');

        preview.classList.add('show');
        bar.style.width = '0%';
        pct.innerText = '0%';

        if (file.type.startsWith('video/')) icon.innerText = '🎥';
        else icon.innerText = '📷';

        document.getElementById('sendBtn').disabled = true;

        // Fetch signature for client-side direct upload
        fetch('/api/sign_upload?type=post')
          .then(r => r.json())
          .then(signData => {
            if (signData.error) {
              showNotif('Signature error');
              cancelUpload();
              return;
            }

            const formData = new FormData();
            formData.append('file', file);
            formData.append('api_key', signData.api_key);
            formData.append('timestamp', signData.timestamp);
            formData.append('signature', signData.signature);
            formData.append('folder', signData.folder);

            const xhr = new XMLHttpRequest();
            xhr.open('POST', `https://api.cloudinary.com/v1_1/${signData.cloud_name}/auto/upload`, true);

            xhr.upload.onprogress = (event) => {
              if (event.lengthComputable) {
                const percent = Math.round((event.loaded / event.total) * 100);
                document.getElementById('uploadBar').style.width = percent + '%';
                document.getElementById('uploadPct').textContent = percent + '%';
              }
            };

            xhr.onload = () => {
              if (xhr.status >= 200 && xhr.status < 300) {
                const res = JSON.parse(xhr.responseText);
                pendingMediaUrl = res.secure_url;
                pendingMediaType = res.resource_type;
                document.getElementById('uploadPct').textContent = 'Attached';
                document.getElementById('sendBtn').disabled = false;
              } else {
                showNotif('Upload failed');
                cancelUpload();
              }
            };

            xhr.onerror = () => {
              showNotif('Upload failed');
              cancelUpload();
            };

            xhr.send(formData);
          })
          .catch(() => {
            showNotif('Network error starting upload');
            cancelUpload();
          });

        e.target.value = '';
      }

      function cancelUpload() {
        pendingMediaUrl = null;
        pendingMediaType = null;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('uploadPreview').classList.remove('show');
        document.getElementById('uploadBar').style.width = '0%';
        document.getElementById('uploadPct').textContent = '0%';
      }

      function formatTime(ms) {
        if (!ms) return '';
        const now = Date.now();
        const diff = now - ms;
        if (diff < 60000) return 'Just now';
        if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
        if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
        const d = new Date(ms);
        return new Intl.DateTimeFormat(navigator.language, { month: 'short', day: 'numeric' }).format(d);
      }

      function showNotif(msg, type = 'info') {
        const n = document.getElementById('notif');
        document.getElementById('notif-text').textContent = msg;
        n.style.background = type === 'error' ? 'var(--terracotta)' : 'var(--earth2)';
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 2800);
      }

      // In-app confirm dialog — replaces browser confirm()
      let _confirmCallback = null;
      function showConfirm(message, onConfirm) {
        _confirmCallback = onConfirm;
        document.getElementById('confirmMsg').textContent = message;
        document.getElementById('confirmModal').style.display = 'flex';
      }
      function confirmYes() {
        document.getElementById('confirmModal').style.display = 'none';
        if (_confirmCallback) { _confirmCallback(); _confirmCallback = null; }
      }
      function confirmNo() {
        document.getElementById('confirmModal').style.display = 'none';
        _confirmCallback = null;
      }

      // --- FOLLOW SYSTEM ---
      function toggleFollow() {
        // Fix 3: Keep the full handle including '@' — DB stores handles WITH '@'
        const handle = document.getElementById('profileViewHandle').textContent.trim();
        const followBtn = document.getElementById('followBtn');
        const isFollowing = followBtn.textContent === 'Unfollow';

        // If a follow request was already sent, clicking cancels it
        if (followBtn.textContent === 'Requested') {
          fetch(`/api/unfollow/${encodeURIComponent(handle)}`, { method: 'POST' })
            .then(r => r.json())
            .then(data => {
              if (data.success) {
                followBtn.textContent = 'Follow';
                followBtn.style.background = 'var(--green3)';
              }
            });
          return;
        }

        const endpoint = isFollowing
          ? `/api/unfollow/${encodeURIComponent(handle)}`
          : `/api/follow/${encodeURIComponent(handle)}`;

        fetch(endpoint, { method: 'POST' })
          .then(r => r.json())
          .then(data => {
            if (data.success) {
              if (data.status === 'requested') {
                followBtn.textContent = 'Requested';
                followBtn.style.background = 'var(--stone)';
                showNotif('Follow request sent');
              } else {
                const nowFollowing = !isFollowing;
                followBtn.textContent = nowFollowing ? 'Unfollow' : 'Follow';
                followBtn.style.background = nowFollowing ? 'var(--stone)' : 'var(--green3)';

                // Update the displayed follower count immediately
                const followerEl = document.getElementById('profFollowers');
                if (followerEl) {
                  const current = parseInt(followerEl.textContent) || 0;
                  followerEl.textContent = nowFollowing ? current + 1 : Math.max(0, current - 1);
                }

                // Refresh full profile data from server for accuracy
                openProfile(handle, document.getElementById('profileViewName').textContent);
              }
            }
          });
      }

      // --- MESSAGES SYSTEM ---
      let currentChatTarget = null;
      let oldestTimestamp = null;
      let isLoadingMore = false;
      let hasMoreMessages = true;

      function openMessages() {
        switchTab('messagesView');
        fetchConversations();
      }

      function fetchConversations() {
        fetch('/api/conversations')
          .then(r => r.json())
          .then(convs => {
            const cl = document.getElementById('convList');
            cl.innerHTML = '';
            let totalUnread = 0;

            if (convs.length === 0) {
              cl.innerHTML = `
              <div style="text-align:center; padding:48px; color:var(--stone); animation: slideIn 0.4s ease-out;">
                <div style="font-size:48px; margin-bottom:16px;">🕊️</div>
                <div style="font-size:18px; font-weight:600; color:var(--earth1);">No messages yet</div>
                <div style="font-size:14px; margin-top:8px;">Visit a profile to start a conversation!</div>
              </div>`;
            } else {
              convs.forEach(c => {
                totalUnread += c.unread_count;
                const item = document.createElement('div');
                item.className = 'conv-item';
                item.onclick = () => openChat(c.other_user.handle, c.other_user.name, c.other_user.photo, c.is_group, c.group_id);

                let photoHtml = '';
                if (c.is_group) {
                  photoHtml = `<div class="mini-avatar" style="background:linear-gradient(135deg,var(--green3),var(--moss));color:white;">👥</div>`;
                } else {
                  photoHtml = c.other_user.photo ? `<img src="${c.other_user.photo}" class="mini-avatar" style="object-fit:cover;">` : `<div class="mini-avatar">${c.other_user.name[0].toUpperCase()}</div>`;
                }
                let unreadHtml = c.unread_count > 0 ? `<div class="unread-badge" style="position:static;">${c.unread_count}</div>` : '';

                const d = new Date(c.timestamp);
                const timeStr = d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes();

                item.innerHTML = `
                  ${photoHtml}
                  <div class="conv-info">
                      <div style="display:flex; justify-content:space-between; align-items:baseline;">
                          <div class="conv-name">${c.other_user.name}</div>
                          <div class="conv-meta">${timeStr}</div>
                      </div>
                      <div class="conv-preview">
                          ${c.last_message}
                      </div>
                  </div>
                  ${unreadHtml}
              `;
                cl.appendChild(item);
              });
            }

            const badge = document.getElementById('navBadge');
            const mobileBadge = document.getElementById('mobileChatBadge');
            if (totalUnread > 0) {
              if (badge) { badge.style.display = 'flex'; badge.textContent = totalUnread; }
              if (mobileBadge) { mobileBadge.style.display = 'flex'; mobileBadge.textContent = totalUnread; }
            } else {
              if (badge) badge.style.display = 'none';
              if (mobileBadge) mobileBadge.style.display = 'none';
            }
          });
      }

      let currentChatTargetIsGroup = false;

      function openChat(handle, name, photoUrl, is_group = false, group_id = null) {
        currentChatTarget = is_group ? group_id : handle;
        currentChatTargetIsGroup = is_group;
        switchTab('chatView');

        // Reset typing indicator
        const typingEl = document.getElementById('typingIndicator');
        if (typingEl) typingEl.textContent = '';

        if (is_group) {
          document.getElementById('chatName').innerHTML = `${name} <span onclick="openEditGroupModal('${group_id}')" style="font-size:14px;color:var(--stone);cursor:pointer;margin-left:8px;font-weight:normal;">⚙️ Edit</span>`;
        } else {
          document.getElementById('chatName').textContent = name;
        }

        const chatAvatar = document.getElementById('chatAvatar');
        const chatAvatarText = document.getElementById('chatAvatarText');
        if (chatAvatar && chatAvatarText) {
          if (is_group) {
            chatAvatar.style.display = 'none';
            chatAvatarText.innerHTML = '👥';
            chatAvatarText.style.display = 'flex';
            chatAvatarText.style.background = 'linear-gradient(135deg,var(--green3),var(--moss))';
            chatAvatarText.style.color = 'white';
          } else if (photoUrl) {
            chatAvatar.src = photoUrl;
            chatAvatar.style.display = 'block';
            chatAvatarText.style.display = 'none';
          } else {
            chatAvatar.style.display = 'none';
            chatAvatarText.textContent = (name || '?')[0].toUpperCase();
            chatAvatarText.style.display = 'flex';
            chatAvatarText.style.background = 'var(--ig-grad)';
          }
        }

        // Reset pagination
        oldestTimestamp = null;
        isLoadingMore = false;
        hasMoreMessages = true;

        // Mark as read immediately and clear badge right away
        if (!is_group) {
          socket.emit('mark_read', { target_handle: currentChatTarget });
          // Clear badge immediately without waiting for fetchConversations
          const badge = document.getElementById('navBadge');
          const mobileBadge = document.getElementById('mobileChatBadge');
          if (badge && parseInt(badge.textContent) > 0) {
            const newCount = Math.max(0, parseInt(badge.textContent) - 1);
            if (newCount === 0) { badge.style.display = 'none'; if(mobileBadge) mobileBadge.style.display='none'; }
            else { badge.textContent = newCount; if(mobileBadge) mobileBadge.textContent = newCount; }
          }
        }

        fetchMessages(currentChatTarget, is_group);
      }

      function setupChatScroll() {
        const area = document.getElementById('chatMessages');
        if (!area) return;
        area.onscroll = () => {
          if (area.scrollTop === 0 && !isLoadingMore && hasMoreMessages && currentChatTarget) {
            fetchMessages(currentChatTarget, currentChatTargetIsGroup, true);
          }
        };
      }

      function fetchMessages(target, is_group, loadMore = false) {
        if (isLoadingMore) return;
        if (loadMore && !hasMoreMessages) return;
        
        isLoadingMore = true;
        const endpoint = is_group 
          ? `/api/group_messages/${target}?limit=30${oldestTimestamp ? '&before=' + oldestTimestamp : ''}` 
          : `/api/messages/${target}?limit=30${oldestTimestamp ? '&before=' + oldestTimestamp : ''}`;
          
        fetch(endpoint)
          .then(r => r.json())
          .then(msgs => {
            const area = document.getElementById('chatMessages');
            const oldHeight = area.scrollHeight;
            
            if (!loadMore) area.innerHTML = '';
            
            if (msgs.length < 30) hasMoreMessages = false;
            
            if (msgs.length > 0) {
              if (loadMore) {
                // Prepend messages
                msgs.reverse().forEach(m => {
                  const msgEl = appendChatMessage(m, is_group, true);
                  area.insertBefore(msgEl, area.firstChild);
                });
                // Maintain scroll position
                area.scrollTop = area.scrollHeight - oldHeight;
              } else {
                msgs.forEach(m => appendChatMessage(m, is_group));
                area.scrollTop = area.scrollHeight;
              }
              oldestTimestamp = msgs[0].timestamp;
            }
            
            isLoadingMore = false;
            // Only refresh conversation list on initial load, not on pagination
            if (!loadMore) {
              fetchConversations();
            }
          })
          .catch(() => {
            isLoadingMore = false;
          });
      }

      function appendChatMessage(m, is_group, returnOnly = false) {
        const area = document.getElementById('chatMessages');
        const wrap = document.createElement('div');
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'column';
        wrap.style.alignItems = m.is_me ? 'flex-end' : 'flex-start';
        wrap.style.margin = '4px 0';

        if (is_group && !m.is_me) {
          const senderLabel = document.createElement('div');
          senderLabel.style.cssText = 'font-size:12px; color:var(--stone); margin-bottom:2px; margin-left:12px;';
          senderLabel.textContent = m.sender_name;
          wrap.appendChild(senderLabel);
        }

        const b = document.createElement('div');
        b.className = `chat-bubble ${m.is_me ? 'me' : 'them'}`;
        
        const textSpan = document.createElement('span');
        textSpan.textContent = typeof decodeHtmlEntities === 'function' ? decodeHtmlEntities(m.text) : m.text;
        b.appendChild(textSpan);
        
        if (m.is_me && !is_group) {
          const tick = document.createElement('span');
          tick.className = 'message-tick';
          tick.style.cssText = 'font-size:11px; opacity:0.7; margin-left:6px; vertical-align: bottom;';
          tick.textContent = m.read ? '✓✓' : '✓';
          tick.id = `tick-${m.id || Math.random().toString(36).substr(2, 9)}`;
          b.appendChild(tick);
        }
        wrap.appendChild(b);
        if (returnOnly) return wrap;
        area.appendChild(wrap);
      }

      // Typing indicator
      let typingTimer = null;
      function handleTypingInput() {
        if (!currentChatTarget) return;
        socket.emit('typing', { target_handle: currentChatTarget, is_typing: true });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
          socket.emit('typing', { target_handle: currentChatTarget, is_typing: false });
        }, 2000);
      }

      socket.on('user_typing', (data) => {
        if (currentChatTarget && (data.sender_handle === currentChatTarget || data.group_id === currentChatTarget)) {
          const el = document.getElementById('typingIndicator');
          if (!el) return;
          if (data.is_typing) {
            el.textContent = `${data.sender_name} is typing...`;
          } else {
            el.textContent = '';
          }
        }
      });

      socket.on('messages_read', (data) => {
        if (currentChatTarget && data.reader_handle === currentChatTarget) {
          // Update all single ticks to double ticks
          document.querySelectorAll('.message-tick').forEach(t => {
            if (t.textContent === '✓') t.textContent = '✓✓';
          });
        }
      });

      let lastMessageTime = 0;
      function sendDM() {
        const now = Date.now();
        if (now - lastMessageTime < 500) { showNotif('Sending too fast...'); return; }

        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !currentChatTarget) return;

        lastMessageTime = now;
        input.value = '';

        // Optimistically show the message immediately
        appendChatMessage({ text: text, is_me: true, read: false }, currentChatTargetIsGroup);
        const area = document.getElementById('chatMessages');
        if (area) area.scrollTop = area.scrollHeight;

        if (currentChatTargetIsGroup) {
          socket.emit('send_group_message', { group_id: currentChatTarget, text: text });
        } else {
          socket.emit('send_message', { target_handle: currentChatTarget, text: text });
        }
      }

      function startChat() {
        const handle = document.getElementById('profileViewHandle').textContent.trim();
        const name = document.getElementById('profileViewName').textContent;
        openChat(handle, name, null); // Will fallback to initials if photo unknown
      }

      // Socket handler for DMs
      socket.on('receive_message', function (msg) {
        const isMe = (msg.sender_id === currentUser.id) || (msg.sender_handle === currentUser.handle);
        // Normalize handles: strip @ for comparison
        const myTarget = (currentChatTarget || '').replace(/^@/, '');
        const msgSender = (msg.sender_handle || '').replace(/^@/, '');
        const msgTarget = (msg.target_handle || '').replace(/^@/, '');
        const inThisChat = !currentChatTargetIsGroup && currentChatTarget &&
          ((isMe && msgTarget === myTarget) || (!isMe && msgSender === myTarget));

        if (inThisChat) {
          // Only append received messages — sender already sees their own via optimistic UI
          if (!isMe) {
            appendChatMessage({ id: msg.id, text: msg.text, is_me: false }, false);
            const area = document.getElementById('chatMessages');
            if (area) area.scrollTop = area.scrollHeight;
            socket.emit('mark_read', { target_handle: msg.sender_handle });
          }
        } else {
          fetchConversations();
          if (!isMe) {
            showNotif(`💬 New message from ${msg.sender_name}`);
            // Only show badge when NOT on messages/chat tab
            if (currentTab !== 'messagesView' && currentTab !== 'chatView') {
              const badge = document.getElementById('navBadge');
              const mobileBadge = document.getElementById('mobileChatBadge');
              if (badge) {
                const count = parseInt(badge.textContent || '0') + 1;
                badge.textContent = count;
                badge.style.display = 'flex';
              }
              if (mobileBadge) {
                const count = parseInt(mobileBadge.textContent || '0') + 1;
                mobileBadge.textContent = count;
                mobileBadge.style.display = 'flex';
              }
            }
          }
        }
      });

      socket.on('receive_group_message', function (msg) {
        const isMe = (msg.sender_id === currentUser.id) || (msg.sender_handle === currentUser.handle);
        if (currentChatTargetIsGroup && currentChatTarget === msg.group_id) {
          appendChatMessage({ id: msg.id, text: msg.text, is_me: isMe, sender_name: msg.sender_name }, true);
          const area = document.getElementById('chatMessages');
          if (area) area.scrollTop = area.scrollHeight;
        } else {
          fetchConversations();
          if (!isMe) showNotif(`New group message`);
        }
      });

      socket.on('group_added', function () {
        fetchConversations();
      });

      socket.on('message_error', function (err) {
        showNotif(err.error);
      });

      // --- NOTIFICATIONS SYSTEM ---
      let unreadNotifs = 0;

      function openNotifications() {
        switchTab('notificationsView');
        fetchNotifications();
        if (document.getElementById('notifBadge')) document.getElementById('notifBadge').style.display = 'none';
        if (document.getElementById('mobileNotifBadge')) document.getElementById('mobileNotifBadge').style.display = 'none';
        unreadNotifs = 0;

        // Mark as read on server
        fetch('/api/notifications/read', { method: 'POST' });
      }

      function fetchNotifications() {
        fetch('/api/notifications')
          .then(r => r.json())
          .then(notifs => {
            const nl = document.getElementById('notifList');
            nl.innerHTML = '';

            if (notifs.length === 0) {
              nl.innerHTML = `
              <div style="text-align:center; padding:64px 24px; color:var(--text-dim); animation: slideIn 0.4s ease-out;">
                <div style="font-size:56px; margin-bottom:20px; filter: drop-shadow(0 0 10px var(--accent-glow));">🪹</div>
                <div style="font-size:20px; font-weight:700; color:var(--text-main);">All caught up!</div>
                <div style="font-size:14px; margin-top:10px; opacity:0.7;">You have no new notifications.</div>
              </div>`;
            } else {
              notifs.forEach(n => {
                const item = document.createElement('div');
                item.className = 'conv-item';
                if (!n.is_read) item.style.background = 'rgba(61, 255, 140, 0.04)';

                let photoHtml = n.sender_photo ? `<img src="${n.sender_photo}" class="mini-avatar" style="object-fit:cover;">` : (n.sender_name ? `<div class="mini-avatar">${n.sender_name[0].toUpperCase()}</div>` : `<div class="mini-avatar">?</div>`);

                let actionsHtml = '';
                if (n.type === 'follow_request') {
                  actionsHtml = `
                      <div style="display:flex; gap:8px; margin-top:8px;">
                          <button class="btn-primary" style="padding:6px 12px; font-size:13px; border-radius:16px;" onclick="acceptFollow('${n.sender_handle}', event)">Accept</button>
                          <button style="padding:6px 12px; font-size:13px; border-radius:16px; background:var(--stone); color:white; border:none; cursor:pointer;" onclick="declineFollow('${n.sender_handle}', event)">Decline</button>
                      </div>
                  `;
                }

                item.innerHTML = `
                  ${photoHtml}
                  <div class="conv-info">
                      <div class="conv-name" style="color:var(--text-main); font-size:14px; font-weight:400;">
                        <strong style="color:var(--accent); cursor:pointer;">${n.sender_name || 'System'}</strong> ${n.text || n.content}
                      </div>
                      <div class="conv-meta" style="text-align:left; margin-top:2px; opacity:0.6;">${formatTime(n.timestamp)}</div>
                      ${actionsHtml}
                  </div>
              `;
                if (n.sender_handle) {
                  item.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                      openProfile(n.sender_handle, n.sender_name);
                    }
                  };
                }
                nl.appendChild(item);
              });
            }
          });
      }

      function acceptFollow(handle, e) {
        if (e) e.stopPropagation();
        fetch(`/api/follow/accept/${handle}`, { method: 'POST' })
          .then(r => r.json())
          .then(data => {
            if (data.success) fetchNotifications();
          });
      }

      function declineFollow(handle, e) {
        if (e) e.stopPropagation();
        fetch(`/api/follow/decline/${handle}`, { method: 'POST' })
          .then(r => r.json())
          .then(data => {
            if (data.success) fetchNotifications();
          });
      }

      socket.on('receive_notification', function (n) {
        unreadNotifs++;
        const badge = document.getElementById('notifBadge');
        const mobileBadge = document.getElementById('mobileNotifBadge');
        if (badge) { badge.textContent = unreadNotifs; badge.style.display = 'flex'; }
        if (mobileBadge) { mobileBadge.textContent = unreadNotifs; mobileBadge.style.display = 'flex'; }

        showNotif(n.content);

        if (document.getElementById('notificationsView').style.display === 'flex') {
          fetchNotifications();
        }
      });

      // Update Profile Open to check follow status and cover photo
      const originalOpenProfile = openProfile;
      openProfile = function (handle, name) {
        originalOpenProfile(handle, name); // Does the UI stuff and fetches posts

        // Reset cover each time
        const coverImg = document.getElementById('profileCoverImg');
        const coverBtn = document.getElementById('coverUploadBtn');
        const editBtn = document.getElementById('editProfBtn');
        coverImg.style.display = 'none';
        coverImg.src = '';
        if (coverBtn) coverBtn.style.display = 'none';
        if (editBtn) editBtn.style.display = 'none';

        if (currentUser) {
          fetch(`/api/user/${handle}`, { cache: 'no-store' })
            .then(r => r.json())
            .then(u => {
              document.getElementById('profFollowers').textContent = u.followers_count;
              document.getElementById('profFollowing').textContent = u.following_count;

              // Cover photo
              const pCoverWrap = document.getElementById('profileCoverWrap');
              if (u.cover) {
                coverImg.src = u.cover;
                coverImg.style.display = 'block';
                if (pCoverWrap) pCoverWrap.style.display = 'block';
              } else {
                if (pCoverWrap) pCoverWrap.style.display = u.is_self ? 'block' : 'none';
              }

              // Avatar DP Fix
              const pAvatar = document.getElementById('profileViewAvatar');
              const pAvatarText = document.getElementById('profileViewAvatarText');
              if (u.photo) {
                pAvatar.src = u.photo;
                pAvatar.style.display = 'block';
                pAvatarText.style.display = 'none';
              } else {
                pAvatar.style.display = 'none';
                pAvatarText.textContent = (u.name || handle).charAt(0).toUpperCase();
                pAvatarText.style.display = 'flex';
              }

              const fbtn = document.getElementById('followBtn');
              const mbtn = document.getElementById('messageBtn');

              if (!u.is_self) {
                fbtn.style.display = 'block';
                if (u.is_requested) {
                  fbtn.textContent = 'Requested';
                  fbtn.style.setProperty('background-color', '#4A5D4E', 'important');
                  fbtn.style.setProperty('color', '#FFFFFF', 'important');
                } else {
                  fbtn.textContent = u.is_following ? 'Unfollow' : 'Follow';
                  fbtn.style.setProperty('background-color', (u.is_following ? '#4A5D4E' : '#3DFF8C'), 'important');
                  fbtn.style.setProperty('color', (u.is_following ? '#FFFFFF' : '#0A0D0B'), 'important');
                }

                if (u.is_mutual) {
                  mbtn.style.display = 'block';
                  mbtn.style.setProperty('color', '#3DFF8C', 'important');
                  mbtn.style.setProperty('border', '2px solid #3DFF8C', 'important');
                  mbtn.style.setProperty('background', 'transparent', 'important');
                } else {
                  mbtn.style.display = 'none';
                }
              } else {
                fbtn.style.display = 'none';
                mbtn.style.display = 'none';
                if (editBtn) editBtn.style.display = 'block';
                if (coverBtn) coverBtn.style.display = 'block';
              }
            });
        }
      }

      // Check unread badge on load
      if (currentUser) {
        socket.emit('join_chat', {});
        fetchConversations();
        setupChatScroll();
      }

      // --- COVER PHOTO UPLOAD ---
      function uploadCoverPhoto(e) {
        const file = e.target.files[0];
        if (!file) return;
        showNotif('Uploading cover photo...');

        const formData = new FormData();
        formData.append('media', file);
        formData.append('type', 'cover');

        fetch('/upload', { method: 'POST', body: formData })
          .then(r => r.json())
          .then(data => {
            if (data.error) { showNotif('Upload failed: ' + data.error); return; }
            const coverImg = document.getElementById('profileCoverImg');
            coverImg.src = data.url;
            coverImg.style.display = 'block';
            showNotif('Cover photo updated! 🌄');
            if (currentUser) currentUser.cover = data.url;
          })
          .catch(() => showNotif('Cover upload failed'));
        e.target.value = '';
      }

      // --- EXPLORE FUNCTIONS ---
      let currentExploreNode = 'All';

      function setExploreNode(node) {
        currentExploreNode = node;
        document.querySelectorAll('.node-pill').forEach(p => {
          p.classList.toggle('active', p.dataset.node === node);
        });
        filterExplorePosts();
      }

      // ── DYNAMIC SIDEBAR ──────────────────────────────────────────────
      async function loadSidebar() {
        try {
          // Load trending topics
          const tRes = await fetch('/api/trending');
          const trends = await tRes.json();
          const tList = document.getElementById('trendingList');
          if (tList) {
            if (trends.length === 0) {
              tList.innerHTML = '<div style="color:var(--text-dim);font-size:13px;padding:8px 0;">Post something to start trends! 🌱</div>';
            } else {
              tList.innerHTML = trends.map(t => `
                <div class="trend-item" onclick="switchTab('explore'); document.getElementById('exploreSearch').value='${t.name}'; filterExplorePosts();" style="cursor:pointer;">
                  <div class="trend-category">${t.category}</div>
                  <div class="trend-name">${t.name}</div>

                  ? `<img src="${u.photo}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="mini-avatar" style="display:none;">${u.name[0].toUpperCase()}</div>`

                    onclick="followFromSidebar('${u.handle}', this)">Follow</button>

      async function filterExplorePosts() {
        const search = (document.getElementById('exploreSearch')?.value || '').toLowerCase();
        const area = document.getElementById('explorePostsArea');
        const usersArea = document.getElementById('exploreUsersArea');
        if (!area) return;
        area.innerHTML = '';

        if (usersArea) {
           if (!search) {
               usersArea.style.display = 'none';
               usersArea.innerHTML = '';
           } else {
               usersArea.style.display = 'flex';
               usersArea.innerHTML = '<div style="font-size:14px; color:var(--text-dim);">Searching users...</div>';
               try {
                   const res = await fetch(`/api/search/users?q=${encodeURIComponent(search)}`);
                   const users = await res.json();
                   if (users.length > 0) {
                       usersArea.innerHTML = `<div style="font-weight:700; font-size:13px; color:var(--stone); text-transform:uppercase; letter-spacing:0.5px;">Users</div>` + 
                       users.map(u => `
                        <div style="display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;background:rgba(139,94,60,0.03);cursor:pointer;transition:background 0.2s;" onmouseover="this.style.background='rgba(139,94,60,0.06)'" onmouseout="this.style.background='rgba(139,94,60,0.03)'" onclick="openProfile('${u.handle}','${u.name.replace(/'/g, "\\'")}')">
                          ${u.photo
                          ? `<img src="${u.photo}" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="mini-avatar" style="display:none;">${u.name[0].toUpperCase()}</div>`
                          : `<div class="mini-avatar">${u.name[0].toUpperCase()}</div>`}
                          <div style="flex:1;min-width:0;">
                            <div style="font-weight:700;font-size:14px;color:var(--text-main);">${u.name}</div>
                            <div style="color:var(--text-dim);font-size:12px;">${u.handle}</div>
                          </div>
                        </div>`).join('');
                   } else {
                       usersArea.innerHTML = '';
                       usersArea.style.display = 'none';
                   }
               } catch (e) {
                   console.error('User search failed', e);
                   usersArea.innerHTML = '';
                   usersArea.style.display = 'none';
               }
           }
        }

        const filtered = ALL_POSTS.filter(p => {
          const matchNode = currentExploreNode === 'All' || p.node === currentExploreNode;
          const matchSearch = !search ||
            (p.text && p.text.toLowerCase().includes(search)) ||
            (p.sender && p.sender.toLowerCase().includes(search)) ||
            (p.handle && p.handle.toLowerCase().includes(search));
          return matchNode && matchSearch;
        });

        if (filtered.length === 0) {
          area.innerHTML = `<div style="text-align:center; padding:48px; color:var(--stone);">
          <div style="font-size:48px; margin-bottom:16px;">🌿</div>
          <div style="font-size:18px; font-weight:600; color:var(--earth1);">No posts found</div>
          <div style="font-size:14px; margin-top:8px;">Try a different node or keyword.</div>
        </div>`;
          return;
        }
        filtered.forEach(p => addPostToFeed(p, false, 'explorePostsArea'));
      }

      // --- AI CHAT FUNCTIONS ---
      let aiHistory = [];

      async function sendAIMessage() {
        const input = document.getElementById('aiInput');
        const text = input.value.trim();
        if (!text) return;
        input.value = '';

        appendAIMessage(text, 'user');
        aiHistory.push({ role: 'user', content: text });

        // Typing indicator
        const typingId = 'ai-typing-' + Date.now();
        const typingDiv = document.createElement('div');
        typingDiv.id = typingId;
        typingDiv.style.cssText = 'display:flex; gap:12px; align-items:flex-start;';
        typingDiv.innerHTML = `
        <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green3),var(--moss));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">🌿</div>
        <div class="chat-bubble them" style="border-radius:16px 16px 16px 4px;font-style:italic;opacity:0.6;">Thinking...</div>`;
        document.getElementById('aiMessages').appendChild(typingDiv);
        document.getElementById('aiMessages').scrollTop = 99999;

        try {
          const res = await fetch('/api/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, history: aiHistory.slice(0, -1) })
          });
          const data = await res.json();
          document.getElementById(typingId)?.remove();
          const reply = data.reply || 'Sorry, something went wrong.';
          appendAIMessage(reply, 'ai');
          aiHistory.push({ role: 'model', content: reply });
        } catch (e) {
          document.getElementById(typingId)?.remove();
          appendAIMessage('Connection error. Please try again.', 'ai');
        }
      }

      function appendAIMessage(text, role) {
        const area = document.getElementById('aiMessages');
        const decoded = typeof decodeHtmlEntities === 'function' ? decodeHtmlEntities(text) : text;
        const safe = decoded.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
        const wrap = document.createElement('div');
        if (role === 'user') {
          wrap.style.cssText = 'display:flex; justify-content:flex-end;';
          wrap.innerHTML = `<div class="chat-bubble me" style="border-radius:16px 16px 4px 16px; max-width:80%;">${safe}</div>`;
        } else {
          wrap.style.cssText = 'display:flex; gap:12px; align-items:flex-start;';
          wrap.innerHTML = `
          <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--green3),var(--moss));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">🌿</div>
          <div class="chat-bubble them" style="border-radius:16px 16px 16px 4px; max-width:80%; white-space:pre-wrap;">${safe}</div>`;
        }
        area.appendChild(wrap);
        area.scrollTop = 99999;
      }
    </script>
    <script>
      let currentFollowViewHandle = '';
      function openFollowListModal(initialTab) {

        if (!titleEl) return;
        currentFollowViewHandle = titleEl.textContent.trim().replace('@', '');

      function switchFollowViewTab(tab) {
        const fBtn = document.getElementById('viewTabFollowersBtn');
        const flBtn = document.getElementById('viewTabFollowingBtn');
        const title = document.getElementById('followListViewTitle');
        if (title) title.textContent = tab === 'followers' ? 'Followers' : 'Following';
        if (tab === 'followers') {
          if (fBtn) { fBtn.style.color = '#fff'; fBtn.style.borderBottomColor = 'var(--accent)'; fBtn.style.background = 'rgba(255,255,255,0.03)'; }

          loadFollowViewList('followers');

      function loadFollowViewList(type) {
        const container = document.getElementById('followViewListContainer');
        if (!container) return;
        container.innerHTML = '<div style="text-align:center; padding:32px; color:var(--text-dim);">Loading...</div>';
        fetch(`/api/user/${currentFollowViewHandle}/${type}`)
          .then(r => r.json())
          .then(users => {
            if (users.error) { container.innerHTML = `<div style="text-align:center; padding:32px; color:#ff4a4a;">${users.error}</div>`; return; }
            if (users.length === 0) { container.innerHTML = `<div style="text-align:center; padding:48px 24px; color:var(--text-dim);">No ${type} yet.</div>`; return; }
            
            container.innerHTML = users.map(u => `
              <div style="display:flex; align-items:center; gap:14px; padding:12px 16px; background:rgba(255,255,255,0.02); border:1px solid rgba(255,255,255,0.06); border-radius:16px; cursor:pointer; transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.06)'" onmouseout="this.style.background='rgba(255,255,255,0.02)'" onclick="openProfile('${u.handle}', '${u.name.replace(/'/g, "\\'")}')">
                ${u.photo ? `<img src="${u.photo}" style="width:48px; height:48px; border-radius:50%; object-fit:cover; flex-shrink:0;">` : `<div class="mini-avatar" style="width:48px; height:48px; font-size:18px;">${(u.name || u.handle)[0].toUpperCase()}</div>`}
                <div style="flex:1; min-width:0;">
                  <div style="font-weight:700; font-size:16px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${u.name}</div>
                  <div style="font-size:14px; color:var(--text-dim);">${u.handle}</div>
                  ${u.bio ? `<div style="font-size:13px; color:#a8a8a8; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${u.bio}</div>` : ''}
                </div>
                ${!u.is_self ? `<button class="btn-primary" style="padding:8px 20px; font-size:14px; border-radius:14px; background:${u.is_following ? '#4A5D4E' : 'var(--accent)'}; color:${u.is_following ? '#fff' : '#0A0D0B'}; font-weight:700;" onclick="event.stopPropagation(); toggleUserFollowView('${u.handle}', this)">${u.is_following ? 'Following' : 'Follow'}</button>` : ''}
              </div>
            `).join('');
          })
          .catch(() => { container.innerHTML = '<div style="text-align:center; padding:32px; color:#ff4a4a;">Failed to load list.</div>'; });
      }

      function toggleUserFollowView(handle, btn) {
        btn.disabled = true;
        fetch(`/api/follow/${encodeURIComponent(handle)}`, { method: 'POST' })
          .then(r => r.json())
          .then(data => {
            btn.disabled = false;
            if (data.success) {
              if (btn.textContent === 'Follow') {
                btn.textContent = 'Following';
                btn.style.background = '#4A5D4E';
                btn.style.color = '#fff';
              } else {
                btn.textContent = 'Follow';
                btn.style.background = 'var(--accent)';
                btn.style.color = '#0A0D0B';
              }
              if (currentFollowViewHandle === (currentUser?.handle || '').replace('@','')) {
                fetch(`/api/user/${currentFollowViewHandle}`)
                  .then(r=>r.json())
                  .then(u=>{
                    const pf = document.getElementById('profFollowers');
                    const pfg = document.getElementById('profFollowing');
                    if(pf) pf.textContent = u.followers_count;
                    if(pfg) pfg.textContent = u.following_count;
                  });
              }
            }
          })
          .catch(() => { btn.disabled = false; });
      }
    </script>

    <script>
      function openCreateGroupModal() {
        document.getElementById('groupModalTitle').textContent = 'Create Group';
        document.getElementById('groupModalSub').textContent = 'Gather your community.';
        document.getElementById('editGroupId').value = '';
        document.getElementById('groupNameInput').value = '';
        document.getElementById('deleteGroupBtn').style.display = 'none';
        document.getElementById('groupModal').style.display = 'flex';

        fetch('/api/following')
          .then(r => r.json())
          .then(following => populateGroupMembers(following, []))
          .catch(() => showNotif('Could not load contacts'));
      }

      function openEditGroupModal(groupId) {
        document.getElementById('groupModalTitle').textContent = 'Edit Group';
        document.getElementById('groupModalSub').textContent = 'Manage members and name.';
        document.getElementById('editGroupId').value = groupId;
        document.getElementById('groupModal').style.display = 'flex';

        fetch('/api/groups/' + groupId + '/members').then(r => r.json()).then(data => {
          if (data.error) { showNotif(data.error); closeGroupModal(); return; }

          document.getElementById('groupNameInput').value = data.name || '';

          // Show delete button only if current user is admin
          if (String(data.admin_id) === String(currentUser.id)) {
            document.getElementById('deleteGroupBtn').style.display = 'block';
          } else {
            document.getElementById('deleteGroupBtn').style.display = 'none';
          }

          const selectedHandles = data.members.map(m => m.handle);
          populateGroupMembers(data.following, selectedHandles);
        });
      }

      function populateGroupMembers(following, selectedHandles) {
        const list = document.getElementById('groupMembersList');
        list.innerHTML = '';
        if (following.length === 0) {
          list.innerHTML = '<div style="padding:20px; color:var(--stone); font-size:14px; text-align:center;">You are not following anyone yet.</div>';
          return;
        }

        following.forEach(u => {
          const item = document.createElement('label');
          item.className = 'group-member-item';

          const isChecked = selectedHandles.includes(u.handle);
          item.innerHTML = `
          <input type="checkbox" value="${u.handle}" class="group-member-cb" ${isChecked ? 'checked' : ''}>
          <div style="flex:1;">
            <div style="font-size:15px; font-weight:600; color:var(--earth1);">${u.name}</div>
            <div style="font-size:13px; color:var(--stone);">${u.handle}</div>
          </div>
        `;
          list.appendChild(item);
        });
      }

      function deleteGroup() {
        const groupId = document.getElementById('editGroupId').value;
        if (!groupId) return;

        showConfirm('Delete this group permanently?', () => {
          fetch('/api/groups/' + groupId, { method: 'DELETE' })
            .then(r => r.json())
            .then(data => {
              if (data.success) {
                showNotif('Group deleted');
                closeGroupModal();
                switchTab('messagesView');
                fetchConversations();
              } else {
                showNotif(data.error || 'Delete failed');
              }
            });
        });
      }

      function closeGroupModal() {
        document.getElementById('groupModal').style.display = 'none';
      }

      function saveGroup(e, btnEl) {
        const name = document.getElementById('groupNameInput').value.trim();
        const groupId = document.getElementById('editGroupId').value;
        if (!name) { showNotif('Group name required'); return; }

        const cbs = document.querySelectorAll('.group-member-cb:checked');
        const handles = Array.from(cbs).map(c => c.value);

        const btn = btnEl || document.querySelector('#groupModal .btn-primary');
        const oldText = btn.textContent;
        btn.textContent = 'Saving...';
        btn.disabled = true;

        if (groupId) {
          // Edit
          fetch('/api/groups/' + groupId, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, member_handles: handles })
          }).then(r => r.json()).then(d => {
            btn.textContent = oldText;
            btn.disabled = false;
            if (d.success) {
              showNotif('Group updated');
              closeGroupModal();
              openChat(currentChatTarget, name, null, true, groupId); // refresh
            } else {
              showNotif(d.error || 'Update failed');
            }
          }).catch(() => {
            btn.textContent = oldText;
            btn.disabled = false;
          });
        } else {
          // Create
          fetch('/api/groups', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: name, member_handles: handles })
          }).then(r => r.json()).then(d => {
            btn.textContent = oldText;
            btn.disabled = false;
            if (d.success) {
              showNotif('Group created! 🌿');
              closeGroupModal();
              fetchConversations();
              openChat('group_' + d.group_id, name, null, true, d.group_id);
            } else {
              showNotif(d.error || 'Creation failed');
            }
          }).catch(() => {
            btn.textContent = oldText;
            btn.disabled = false;
          });
        }
      }

      function openComposer() {
        switchTab('feedView');
        switchFeedTab('ForYou');
        // Scroll to top of posts area
        const postsArea = document.getElementById('postsArea');
        if (postsArea) postsArea.scrollTop = 0;
        window.scrollTo({ top: 0, behavior: 'smooth' });

        setTimeout(() => {
          const input = document.getElementById('msgInput');
          if (input) {
            input.focus();
            const composer = document.getElementById('feedComposer');
            if (composer) {
              composer.style.boxShadow = '0 0 20px var(--accent-glow)';
              setTimeout(() => { composer.style.boxShadow = ''; }, 1500);
            }
          }
        }, 150);
      }
    </script>
