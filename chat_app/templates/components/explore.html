<!-- EXPLORE VIEW -->
    <div class="main-feed" id="exploreView" style="display:none;">
      <div class="feed-header" style="padding: 16px 24px;">
        <h2 style="font-size:20px; font-weight:700; margin-bottom:16px;">Explore</h2>
        <div class="search-bar" style="margin-bottom:16px;">
          <input type="text" id="exploreSearch" placeholder="Search topics or people..." oninput="filterExplorePosts()">
        </div>
        <div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:8px;">
          <button onclick="setExploreNode('All')" class="node-pill active" data-node="All">All</button>
          <button onclick="setExploreNode('India News')" class="node-pill" data-node="India News">India News</button>
          <button onclick="setExploreNode('Technology')" class="node-pill" data-node="Technology">Tech</button>
          <button onclick="setExploreNode('Environment')" class="node-pill" data-node="Environment">Environment</button>
          <button onclick="setExploreNode('Entertainment')" class="node-pill" data-node="Entertainment">Entertainment</button>
        </div>
      </div>
      <div id="exploreUsersArea" style="display:none; flex-direction:column; gap:12px; padding: 0 24px 16px 24px;"></div>
      <div class="posts-area" id="explorePostsArea"></div>
    </div>
