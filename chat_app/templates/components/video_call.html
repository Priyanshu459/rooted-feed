<!-- ZEGOCLOUD VIDEO CALL COMPONENT -->
<!-- Opens the call in a dedicated popup page to avoid SDK/CSP conflicts -->

<!-- Incoming Call Modal -->
<div id="incomingCallModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(8px); z-index:9999; flex-direction:column; justify-content:center; align-items:center;">
    <div style="padding:40px; border-radius:24px; text-align:center; max-width:400px; width:90%; background:#1a1a1a; border:1px solid rgba(255,255,255,0.12); box-shadow:0 24px 48px rgba(0,0,0,0.6);">
        <div style="margin-bottom:20px;">
            <img id="incomingCallAvatar" src="" alt="" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid #c13584; display:none; margin:0 auto;">
            <div id="incomingCallAvatarText" style="width:90px; height:90px; border-radius:50%; background:linear-gradient(135deg,#c13584,#833ab4); display:none; align-items:center; justify-content:center; font-size:36px; font-weight:700; color:white; margin:0 auto;"></div>
        </div>
        <h2 id="incomingCallName" style="color:white; font-size:22px; font-weight:700; margin:0 0 8px;">Calling...</h2>
        <p id="incomingCallType" style="color:#999; font-size:15px; margin:0 0 32px;">Incoming Video Call</p>
        <div style="display:flex; justify-content:center; gap:32px;">
            <div style="text-align:center;">
                <button onclick="rejectCall()" style="width:60px; height:60px; border-radius:50%; background:#FF3B30; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(255,59,48,0.45); margin:0 auto 8px;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(135deg)"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </button>
                <span style="color:#999; font-size:12px;">Decline</span>
            </div>
            <div style="text-align:center;">
                <button onclick="acceptCall()" style="width:60px; height:60px; border-radius:50%; background:#34C759; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(52,199,89,0.45); margin:0 auto 8px;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                </button>
                <span style="color:#999; font-size:12px;">Accept</span>
            </div>
        </div>
    </div>
    <audio id="ringtoneAudio" loop>
        <source src="https://actions.google.com/sounds/v1/alarms/spaceship_alarm.ogg" type="audio/ogg">
    </audio>
</div>

<script>
(function () {
    var incomingCallData = null;

    // Build the call URL and open in a popup window
    function openCallPopup(roomID, isGroup) {
        var cu = (typeof currentUser !== 'undefined' && currentUser) ? currentUser : {};
        var userID   = String(cu.id   || cu.uuid || (Math.floor(Math.random() * 99999) + ''));
        var userName = encodeURIComponent(cu.name || cu.handle || 'Rooted User');
        var url = '/call?roomID=' + encodeURIComponent(roomID) +
                  '&userID=' + encodeURIComponent(userID) +
                  '&userName=' + userName +
                  '&isGroup=' + (isGroup ? 'true' : 'false');

        var popup = window.open(url, 'RootedVideoCall',
            'width=800,height=640,resizable=yes,scrollbars=no,toolbar=no,menubar=no,location=no,status=no');
        if (!popup) {
            // Fallback if popups are blocked
            showNotif('Please allow popups for this site to use Video Call.', 'error');
        }
    }

    // 🎥 Button click handler
    window.startVideoCall = function () {
        if (typeof currentChatTarget === 'undefined' || !currentChatTarget) {
            showNotif('Open a chat first, then click Video Call.');
            return;
        }
        var isGroup  = (typeof currentChatTargetIsGroup !== 'undefined') && currentChatTargetIsGroup;
        var roomID   = 'rooted_' + Date.now().toString();
        var targetId = String(currentChatTarget).replace('group_', '');

        // Ring the other person via socket
        socket.emit('initiate_call', {
            target_id: targetId,
            room_id: roomID,
            is_group: isGroup
        });

        showNotif('Calling... 📞');
        openCallPopup(roomID, isGroup);
    };

    // Incoming call events
    document.addEventListener('DOMContentLoaded', function () {
        if (typeof socket === 'undefined') return;

        socket.on('incoming_call', function (data) {
            incomingCallData = data;

            var avatarImg = document.getElementById('incomingCallAvatar');
            var avatarTxt = document.getElementById('incomingCallAvatarText');
            if (data.caller_avatar) {
                avatarImg.src = data.caller_avatar;
                avatarImg.style.display = 'block';
                avatarTxt.style.display = 'none';
            } else {
                avatarTxt.textContent = (data.caller_name || '?')[0].toUpperCase();
                avatarTxt.style.display = 'flex';
                avatarImg.style.display = 'none';
            }
            document.getElementById('incomingCallName').textContent = data.caller_name || 'Someone';
            document.getElementById('incomingCallType').textContent = data.is_group ? 'Incoming Group Video Call' : 'Incoming Video Call';
            document.getElementById('incomingCallModal').style.display = 'flex';
            document.getElementById('ringtoneAudio').play().catch(function () {});
        });

        socket.on('call_rejected', function () {
            showNotif('Call was declined.');
        });
    });

    window.acceptCall = function () {
        if (!incomingCallData) return;
        document.getElementById('incomingCallModal').style.display = 'none';
        document.getElementById('ringtoneAudio').pause();
        var data = incomingCallData;
        incomingCallData = null;
        openCallPopup(data.room_id, data.is_group);
    };

    window.rejectCall = function () {
        document.getElementById('incomingCallModal').style.display = 'none';
        document.getElementById('ringtoneAudio').pause();
        if (incomingCallData) {
            socket.emit('reject_call', { caller_id: incomingCallData.caller_id });
            incomingCallData = null;
        }
    };
}());
</script>
